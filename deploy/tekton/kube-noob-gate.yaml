# kube-noob gate as a Tekton Task: audit manifests and Containerfiles in the source workspace before deploy.
# Offline: no network, no cluster access, no model. Fails at params.fail-on; writes SARIF and a Markdown summary
# into the optional output workspace. Render Helm charts in an earlier step (helm template ... > rendered.yaml) and pass the file.
# Install: kubectl apply -f deploy/tekton/kube-noob-gate.yaml (or oc apply -n <pipelines-namespace>)
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: kube-noob-gate
  labels:
    app.kubernetes.io/name: kube-noob-gate
    app.kubernetes.io/version: "0.9.2"
  annotations:
    tekton.dev/pipelines.minVersion: "0.50.0"
    tekton.dev/categories: Security
    tekton.dev/tags: kubernetes, openshift, security, audit, sarif
    tekton.dev/displayName: kube-noob gate
    tekton.dev/platforms: linux/amd64,linux/arm64
spec:
  description: >-
    Audits Kubernetes and OpenShift manifests and Containerfiles (audit rules, admission-policy coverage, reported
    issues in the target OpenShift release), fails at a severity you choose and writes SARIF 2.1.0 and a Markdown
    summary. Offline.
  workspaces:
    - name: source
      description: The checked-out repository (and any rendered manifests). Only read.
      readOnly: true
    - name: output
      description: Where kube-noob.sarif and kube-noob-summary.md are written (default /tmp in the step).
      optional: true
  params:
    - name: paths
      type: string
      description: Manifest files or directories in the workspace, separated by spaces.
      default: "."
    - name: containerfiles
      type: string
      description: >-
        Containerfiles in the workspace to audit, separated by spaces; with sarif-reports each is also the build that
        ships code, PATH[=IMAGE][,context=DIR][,target=STAGE] (context defaults to the Containerfile's directory).
      default: ""
    - name: scanner-reports
      type: string
      description: >-
        Scanner output of the images in the workspace (Trivy or Grype JSON, CycloneDX or SPDX SBOM, RHACS image JSON),
        separated by spaces.
      default: ""
    - name: vex
      type: string
      description: Red Hat CSAF VEX files or folders in the workspace, for the scanner reports, separated by spaces.
      default: ""
    - name: kev
      type: string
      description: The CISA KEV catalog JSON in the workspace, for the scanner reports.
      default: ""
    - name: sarif-reports
      type: string
      description: SARIF 2.1.0 from your SAST tools in the workspace, separated by spaces.
      default: ""
    - name: trust-report-vex
      type: string
      description: >-
        "true" honours a CycloneDX report's own analysis (not_affected, resolved, false_positive); off by default.
      default: "false"
    - name: platform
      type: string
      description: kubernetes, openshift, rosa-classic or rosa-hcp.
      default: openshift
    - name: version
      type: string
      description: The target OpenShift (4.20) or Kubernetes (1.33) version.
      default: ""
    - name: exceptions
      type: string
      description: An exception list in the workspace (kube-noob.io/v1 ExceptionList).
      default: ""
    - name: fail-on
      type: string
      description: info, low, medium, high, critical or never.
      default: high
    - name: image
      type: string
      description: The kube-noob image (pin it by digest).
      default: ghcr.io/kube-noob/kube-noob:0.9.2
  results:
    - name: result
      description: >-
        The gate's exit code by name, always set: passed (0), failed (1), config-error (2), clarification (3),
        internal-error (4) or evidence-incomplete (5); any other code is internal-error. Merge status only.
    - name: exit-code
      description: The gate's exit code as a number.
    - name: evidence
      description: >-
        complete, incomplete or not-run, read from the gate's report; a passed gate with a check not run is
        incomplete, and a gate that wrote no report is not-run, never complete.
    - name: because
      description: Why the evidence is incomplete or not-run, one line; empty when complete.
    - name: counts
      description: Findings per severity, as JSON ({} when the gate wrote no report).
  steps:
    - name: gate
      image: $(params.image)
      workingDir: $(workspaces.source.path)
      env:
        - {name: KN_PATHS, value: $(params.paths)}
        - {name: KN_CONTAINERFILES, value: $(params.containerfiles)}
        - {name: KN_SCANNER_REPORTS, value: $(params.scanner-reports)}
        - {name: KN_VEX, value: $(params.vex)}
        - {name: KN_KEV, value: $(params.kev)}
        - {name: KN_TRUST_REPORT_VEX, value: $(params.trust-report-vex)}
        - {name: KN_SARIF_REPORTS, value: $(params.sarif-reports)}
        - {name: KN_PLATFORM, value: $(params.platform)}
        - {name: KN_VERSION, value: $(params.version)}
        - {name: KN_EXCEPTIONS, value: $(params.exceptions)}
        - {name: KN_FAIL_ON, value: $(params.fail-on)}
        - {name: KUBE_NOOB_OFFLINE, value: "1"}
        - {name: HOME, value: /tmp}
      computeResources:
        requests: {cpu: 100m, memory: 256Mi}
        limits: {memory: 1Gi}
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
        seccompProfile: {type: RuntimeDefault}
      script: |
        #!/bin/sh
        set -e
        out=/tmp
        if [ "$(workspaces.output.bound)" = "true" ]; then out="$(workspaces.output.path)"; fi
        KN_WORK=/tmp
        KN_SARIF="$out/kube-noob.sarif"
        KN_SUMMARY="$out/kube-noob-summary.md"
        KN_REPORT=/tmp/kube-noob-gate.json
        KN_RESULT_PATH="$(results.result.path)"
        KN_EXIT_PATH="$(results.exit-code.path)"
        KN_EVIDENCE_PATH="$(results.evidence.path)"
        KN_BECAUSE_PATH="$(results.because.path)"
        KN_COUNTS_PATH="$(results.counts.path)"
        # -- scripts/ci/gate.sh follows; written by scripts/ci_wrappers.py, so edit the script, not this file --
        # kube-noob gate, as the three CI wrappers run it: action.yml calls this file; the Tekton Task and the GitLab
        # template carry a copy of its body (scripts/ci_wrappers.py writes it, --check holds it). POSIX sh: no arrays,
        # no brace or command substitution -- the Tekton copy runs through Tekton's own substitution of such text.
        #
        # Inputs, through the environment (the wrappers never splice a user value into this text):
        #   KN_PATHS KN_CHART KN_VALUES KN_NAMESPACE KN_CONTAINERFILES KN_SCANNER_REPORTS KN_VEX KN_KEV
        #   KN_TRUST_REPORT_VEX KN_SARIF_REPORTS KN_PLATFORM KN_VERSION KN_EXCEPTIONS KN_FAIL_ON KN_ANNOTATIONS
        # Files it writes: KN_SARIF KN_SUMMARY KN_REPORT (the JSON report) KN_CODEQUALITY (GitLab), scratch in KN_WORK.
        # Status, to every sink that is set, the same words in each:
        #   GITHUB_OUTPUT        result= exit-code= evidence= because=
        #   GITHUB_STEP_SUMMARY  the headline, then the gate's own summary
        #   KN_DOTENV            KUBE_NOOB_RESULT KUBE_NOOB_EXIT KUBE_NOOB_EVIDENCE KUBE_NOOB_BECAUSE (GitLab dotenv report)
        #   KN_RESULT_PATH KN_EXIT_PATH KN_EVIDENCE_PATH KN_BECAUSE_PATH KN_COUNTS_PATH (Tekton results)
        # result is the exit code's name and nothing else: 0 passed, 1 failed, 2 config-error, 3 clarification,
        # 4 internal-error, 5 evidence-incomplete; any other code is internal-error with its number in exit-code.
        # evidence is read from the report: complete, incomplete (with because) or not-run -- a report that is missing,
        # is not JSON or has no notRun list is not-run, never complete. Merge status is not evidence status: a gate
        # that exits 0 with checks not run says "merge: allowed · evidence: incomplete", never "passed" (G291).
        set -e
        if [ -z "$KN_PLATFORM" ]; then KN_PLATFORM=kubernetes; fi
        if [ -z "$KN_FAIL_ON" ]; then KN_FAIL_ON=high; fi
        if [ -z "$KN_WORK" ]; then KN_WORK=.; fi
        if [ -z "$KN_SARIF" ]; then KN_SARIF=kube-noob.sarif; fi
        if [ -z "$KN_SUMMARY" ]; then KN_SUMMARY=kube-noob-summary.md; fi
        if [ -z "$KN_REPORT" ]; then KN_REPORT=kube-noob-gate.json; fi
        set -- --platform "$KN_PLATFORM" --fail-on "$KN_FAIL_ON"
        if [ -n "$KN_NAMESPACE" ]; then set -- "$@" --namespace "$KN_NAMESPACE"; fi
        for p in $KN_PATHS; do set -- "$@" -f "$p"; done
        if [ -n "$KN_CHART" ]; then set -- "$@" --chart "$KN_CHART"; fi
        for v in $KN_VALUES; do set -- "$@" --values "$v"; done
        for c in $KN_CONTAINERFILES; do set -- "$@" --containerfile "$c"; done
        for r in $KN_SCANNER_REPORTS; do set -- "$@" --scanner-report "$r"; done
        for x in $KN_VEX; do set -- "$@" --vex "$x"; done
        if [ -n "$KN_KEV" ]; then set -- "$@" --kev "$KN_KEV"; fi
        if [ "$KN_TRUST_REPORT_VEX" = "true" ]; then set -- "$@" --trust-report-vex; fi
        for s in $KN_SARIF_REPORTS; do set -- "$@" --sarif-report "$s"; done
        if [ -n "$KN_VERSION" ]; then set -- "$@" --version "$KN_VERSION"; fi
        if [ -n "$KN_EXCEPTIONS" ]; then set -- "$@" --exceptions "$KN_EXCEPTIONS"; fi
        if [ -n "$KN_ANNOTATIONS" ] && [ "$KN_ANNOTATIONS" != "false" ]; then set -- "$@" --github-annotations; fi
        set -- "$@" --sarif "$KN_SARIF" --summary "$KN_SUMMARY"
        if [ -n "$KN_CODEQUALITY" ]; then set -- "$@" --codequality "$KN_CODEQUALITY"; fi
        raw="$KN_WORK/kube-noob-gate.out"
        status="$KN_WORK/kube-noob-gate-status"
        # From here nothing may abort before the status is written: a step that dies between the gate and its outputs
        # is exactly the empty `result` this script exists to refuse.
        set +e
        rc=0
        result=internal-error
        evidence=not-run
        because="the gate report could not be read"
        counts="{}"
        if ! { rm -rf "$status" && mkdir -p "$status"; } 2>/dev/null; then
          # A work directory that cannot be created is a configuration error (2), not findings (1): the gate is not run,
          # the sinks still get their four lines, and the exit says so (review finding 10).
          rc=2
          result=config-error
          because="KN_WORK is not writable: $KN_WORK (no directory could be created there)"
          status=""
        else
          # A gate that exits 2 or 4 writes none of these; what an earlier step in the same job left behind must not be
          # read, summarised or uploaded as this run's.
          rm -f "$raw" "$KN_REPORT" "$KN_SUMMARY" "$KN_SARIF"
          if [ -n "$KN_CODEQUALITY" ]; then rm -f "$KN_CODEQUALITY"; fi
          kube-noob gate "$@" --format json > "$raw" || rc=$?
          # Workflow commands and the JSON report both come out on stdout, so the stream is captured once and split: the
          # `::` lines are echoed to the log, where Actions turns them into annotations, and the rest is the report.
          grep '^::' "$raw" 2>/dev/null
          grep -v '^::' "$raw" > "$KN_REPORT" 2>/dev/null
          case "$rc" in
            0) result=passed ;;
            1) result=failed ;;
            2) result=config-error ;;
            3) result=clarification ;;
            4) result=internal-error ;;
            5) result=evidence-incomplete ;;
            *) result=internal-error ;;
          esac
          python3 -I -c '
        import json, sys
        report, out, rc = sys.argv[1], sys.argv[2], sys.argv[3]
        CUT = 600
        # The Markdown escape table of kube_noob.gate._cell, written once here so the step summary cannot render a file
        # name as an image, a link, an HTML tag, a table cell or a comment (tests/test_ci_wrappers.py holds the two equal).
        ESCAPE = {"&": "&amp;", "<": "&lt;", ">": "&gt;", "|": "\\|"}
        for c in "\\`*_[]!#~":
            ESCAPE[c] = "\\" + c


        def clean(text):
            # One printable line: control characters and anything invisible (bidi marks, soft hyphens, tags) are
            # dropped, whitespace is squeezed, and "::" cannot start a workflow command on the Actions log.
            flat = " ".join("".join(c if c.isprintable() else " " for c in str(text)).split())
            return flat.replace("::", ": :")


        def escape(text):
            return "".join(ESCAPE.get(c, c) for c in text)


        try:
            text = open(report, encoding="utf-8", errors="replace").read()
        except OSError:
            text = ""
        gaps = []
        if not text.strip():
            evidence, because, counts = "not-run", "the gate wrote no report", {}
        else:
            try:
                rep = json.loads(text)
            except ValueError:
                rep = None
            if rep is None:
                evidence, because, counts = "not-run", "the report is not JSON", {}
            elif not isinstance(rep, dict):
                evidence, because, counts = "not-run", "the report is not an object", {}
            elif not isinstance(rep.get("notRun"), list):
                evidence, because, counts = "not-run", "the report has no notRun list", {}
            else:
                # Every entry is a gap, whatever its shape: an unrecognised shape is listed, never dropped.
                gaps = [clean(g) for g in rep["notRun"]]
                unreadable = rep.get("unreadable")
                if unreadable is not None:
                    if isinstance(unreadable, list) and all(isinstance(u, dict) and "file" in u for u in unreadable):
                        gaps += [clean(u.get("file")) + " could not be read" for u in unreadable]
                    else:
                        gaps.append("unreadable: unrecognised shape")
                # Forward-looking: `knownIssuesVerdict` and `requiredEvaluated` are written by the gate once the
                # fix/live-false-passes work lands (G284/G290). Absent, they are not a gap; present, anything but the one
                # value that means evaluated is.
                if "knownIssuesVerdict" in rep:
                    v = rep["knownIssuesVerdict"]
                    if not isinstance(v, str):
                        gaps.append("knownIssuesVerdict: unrecognised shape")
                    elif v.strip().lower().replace("_", "-") == "not-determined":
                        gaps.append("reported issues: not-determined")
                if "requiredEvaluated" in rep and rep["requiredEvaluated"] is not True:
                    gaps.append("required checks: not all evaluated")
                evidence = "incomplete" if gaps else "complete"
                because = "; ".join(gaps)
                counts = rep.get("counts") if isinstance(rep.get("counts"), dict) else {}
        if rc == "5" and evidence == "complete":
            # The gate said 5; the report cannot overrule it (review finding 8).
            evidence, because = "incomplete", "the gate exited 5 (evidence incomplete)"
        because = clean(because)
        if len(because) > CUT:
            because = because[:CUT] + " … (+%d chars)" % (len(because) - CUT)
        because = escape(because)
        for name, value in (("evidence", evidence), ("because", because), ("counts", json.dumps(counts, sort_keys=True))):
            with open(out + "/" + name, "w", encoding="utf-8") as f:
                f.write(value + "\n")
        ' "$KN_REPORT" "$status" "$rc" 2>/dev/null \
            && read -r evidence < "$status/evidence" \
            && read -r because < "$status/because" \
            && read -r counts < "$status/counts" \
            || { evidence=not-run; because="the gate report could not be read"; counts="{}"; }
        fi
        if [ "$rc" = 0 ]; then
          headline="## kube-noob gate: merge allowed · evidence: $evidence"
        else
          headline="## kube-noob gate $result (exit $rc): merge blocked · evidence: $evidence"
        fi
        if [ -n "$because" ]; then
          # In a code span, with its own backticks removed, so nothing in a file name renders (review finding 2).
          span="$because"
          if [ -n "$status" ]; then
            printf '%s\n' "$because" | tr -d '`' > "$status/span"
            read -r span < "$status/span"
          fi
          headline="$headline (\`$span\`)"
        fi
        # The gate's own Markdown starts "## kube-noob gate passed|failed"; that heading is replaced by the headline
        # above, so "passed" never stands beside incomplete evidence. The rest of its summary follows unchanged.
        summary="$status/summary.md"
        if [ -z "$status" ]; then summary=/dev/null; fi
        printf '%s\n' "$headline" > "$summary"
        first=
        if [ -f "$KN_SUMMARY" ]; then read -r first < "$KN_SUMMARY" || true; fi
        case "$first" in
          "## kube-noob gate passed"|"## kube-noob gate failed") tail -n +2 "$KN_SUMMARY" >> "$summary" ;;
          "") printf '\n' >> "$summary" ;;
          *) printf '\n' >> "$summary"; cat "$KN_SUMMARY" >> "$summary" ;;
        esac
        if [ -n "$status" ]; then
          cat "$summary"
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then cat "$summary" >> "$GITHUB_STEP_SUMMARY"; fi
        else
          printf '%s\n\n' "$headline"
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then printf '%s\n\n' "$headline" >> "$GITHUB_STEP_SUMMARY"; fi
        fi
        if [ -n "$GITHUB_OUTPUT" ]; then
          printf 'result=%s\nexit-code=%s\nevidence=%s\nbecause=%s\n' "$result" "$rc" "$evidence" "$because" >> "$GITHUB_OUTPUT"
        fi
        if [ -n "$KN_DOTENV" ]; then
          printf 'KUBE_NOOB_RESULT=%s\nKUBE_NOOB_EXIT=%s\nKUBE_NOOB_EVIDENCE=%s\nKUBE_NOOB_BECAUSE=%s\n' \
            "$result" "$rc" "$evidence" "$because" > "$KN_DOTENV"
        fi
        if [ -n "$KN_RESULT_PATH" ]; then printf '%s' "$result" > "$KN_RESULT_PATH"; fi
        if [ -n "$KN_EXIT_PATH" ]; then printf '%s' "$rc" > "$KN_EXIT_PATH"; fi
        if [ -n "$KN_EVIDENCE_PATH" ]; then printf '%s' "$evidence" > "$KN_EVIDENCE_PATH"; fi
        if [ -n "$KN_BECAUSE_PATH" ]; then printf '%s' "$because" > "$KN_BECAUSE_PATH"; fi
        if [ -n "$KN_COUNTS_PATH" ]; then printf '%s' "$counts" > "$KN_COUNTS_PATH"; fi
        exit "$rc"
