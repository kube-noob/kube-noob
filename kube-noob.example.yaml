# kube-noob configuration (copy to ~/.config/kube-noob/config.yaml, or pass --config <file> / KUBE_NOOB_CONFIG;
# the current directory is not searched implicitly)
offline: false                 # admin lock: true = no web, no corpus downloads, local models only (cannot be lifted later)
webEnabled: false              # true = allow allowlisted web lookups (agent web search + kubenoob_web_fetch)
learningEnabled: true          # local learning.json: your profile, confirmed notes, pattern counters (no logs/secrets)
web:
  allowedDomains: [kubernetes.io, helm.sh, docs.redhat.com, cloud.redhat.com, docs.aws.amazon.com, github.com]
  timeoutSeconds: 20
defaultPlatform: openshift     # kubernetes | openshift | rosa-classic | rosa-hcp
cluster:
  enabled: false               # read-only live cluster tools
  backend: auto                # auto | in-cluster | kubectl | oc
  context: null                # kubeconfig context for kubectl/oc
llm:                           # used by `kube-noob ask` / `train bench`, never by the MCP server
  provider: none               # none | anthropic (pip install 'kube-noob[ask]') | openai-compatible
  model: claude-fable-5-1
  apiKeyEnv: ANTHROPIC_API_KEY  # must name a *_API_KEY variable; only `anthropic` has a default
  # provider: openai-compatible
  # baseUrl: http://localhost:8000/v1   # vLLM / Ollama / your fine-tuned kube-noob model (https, loopback or *.svc;
  #                                     # set allowInsecureBaseUrl: true for other plain-http endpoints)
  # apiKeyEnv: VLLM_API_KEY             # required if that endpoint wants a key: ANTHROPIC_API_KEY is never sent to it
judge:
  provider: none               # eval-only LLM judge; never exported as training labels
server:
  host: 127.0.0.1
  port: 8080
  authTokenEnv: KUBE_NOOB_HTTP_TOKEN
  # Which MCP tools to offer: all (the default, every tool), incident, review, compliance or learn.
  # docs/mcp-tool-profiles.md says what each one holds. A tool outside the profile is refused by name.
  tools: all
