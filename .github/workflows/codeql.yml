name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    # Slowest successful run of this job in the last ten: 3.2 min.
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Held at v4.39.3. v4.39.4 merges this job's two language runs (python, actions) into one SARIF file before
      # upload, and that upload fails intermittently: 2 of 5 runs on v4.39.4 failed at that step on 2026-11-25,
      # against 25 of 25 green on v4.39.3 the same day. A single-run upload is unaffected, which is why
      # scorecard.yml's upload-sarif stays on v4.39.4. Init and analyze must move together. The failure is
      # intermittent, so one green pull-request run will not show the next release is fixed; take it after several.
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: python, actions
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
