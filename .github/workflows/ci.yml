      - name: Admission webhook chart (R3.3) renders in three certificate modes, refuses bad values, audits clean
        run: |
          set -euo pipefail
          trap 'echo "::error title=admission chart::line $LINENO: $BASH_COMMAND"' ERR
          base="--set auth.existingSecret=kn-token --set admission.enabled=true"
          at() { helm template kn deploy/helm/kube-noob -n kube-noob $base "$@"; }
          helm lint --strict deploy/helm/kube-noob $base
          exc="--exceptions .github/kube-noob-exceptions.yaml"
          kube-noob exceptions check .github/kube-noob-exceptions.yaml
          for v in 1.33.0 1.35.0; do
            at --kube-version "$v" --set networkPolicy.allowRouter=false \
              --set admission.certificates=secret --set admission.tls.secretName=kn-tls --set admission.tls.caBundle=Zm9v \
              | kube-noob audit -f - --platform kubernetes --fail-on medium $exc
          done
          for v in 4.20:1.33.0 4.22:1.35.0; do
            at --kube-version "${v#*:}" --api-versions security.openshift.io/v1 --set admission.lookups=true \
              --set "networkPolicy.egress.apiServerCIDRs={172.30.0.1/32}" --set "admission.enforce={KN-S001}" \
              | kube-noob audit -f - --platform openshift --version "${v%%:*}" --fail-on medium $exc
          done
          at --kube-version 1.33.0 --api-versions security.openshift.io/v1 > /tmp/adm-sca.yaml
          at --kube-version 1.33.0 --set admission.certificates=cert-manager \
            --set admission.certManager.issuerRef.name=ca-issuer > /tmp/adm-cm.yaml
          at --kube-version 1.29.0 --set admission.certificates=secret --set admission.tls.secretName=kn-tls \
            --set admission.tls.caBundle=Zm9v --set admission.lookups=true \
            --set "networkPolicy.egress.apiServerCIDRs={10.96.0.1/32}" > /tmp/adm-secret.yaml
          python - <<'PY'
          import yaml

          def load(path):
              return [d for d in yaml.safe_load_all(open(path)) if d]

          def one(docs, kind, name=None):
              hits = [d for d in docs if d["kind"] == kind and (name is None or d["metadata"]["name"] == name)]
              assert len(hits) == 1, (kind, name, [d["metadata"]["name"] for d in hits])
              return hits[0]

          name = "kn-kube-noob-admission"
          system = {"kube-system", "kube-public", "kube-node-lease", "openshift", "kube-noob"}
          for path in ("/tmp/adm-sca.yaml", "/tmp/adm-cm.yaml", "/tmp/adm-secret.yaml"):
              docs = load(path)
              vwc = one(docs, "ValidatingWebhookConfiguration")
              assert not [d for d in docs if d["kind"] == "MutatingWebhookConfiguration"]
              (hook,) = vwc["webhooks"]
              assert hook["failurePolicy"] == "Ignore" and hook["sideEffects"] == "None", hook
              assert hook["timeoutSeconds"] == 3 and hook["matchPolicy"] == "Equivalent", hook
              assert hook["admissionReviewVersions"] == ["v1"], hook
              assert hook["clientConfig"]["service"] == {"name": name, "namespace": "kube-noob", "path": "/validate",
                                                         "port": 443}, hook["clientConfig"]
              sel = hook["namespaceSelector"]["matchExpressions"]
              assert set(sel[0]["values"]) == system and sel[0]["operator"] == "NotIn", sel
              assert sel[1] == {"key": "kube-noob.io/admission", "operator": "NotIn", "values": ["disabled"]}, sel
              assert all(r["scope"] == "Namespaced" and r["operations"] == ["CREATE", "UPDATE"] for r in hook["rules"])
              assert not any("secrets" in r["resources"] for r in hook["rules"])
              dep = one(docs, "Deployment", name)
              spec = dep["spec"]["template"]["spec"]
              assert dep["spec"]["replicas"] == 2 and spec["affinity"]["podAntiAffinity"], spec
              (c,) = spec["containers"]
              assert c["args"][:2] == ["admission", "serve"] and c["readinessProbe"]["httpGet"]["scheme"] == "HTTPS"
              assert one(docs, "PodDisruptionBudget", name)["spec"]["minAvailable"] == 1
              main = one(docs, "Service", "kn-kube-noob")["spec"]["selector"]
              pod = dep["spec"]["template"]["metadata"]["labels"]
              assert not all(pod.get(k) == v for k, v in main.items()), "the server's Service must not select the webhook"
              netpol = one(docs, "NetworkPolicy", name)["spec"]
              assert netpol["ingress"] == [{"ports": [{"protocol": "TCP", "port": 8443}]}], netpol
          sca = load("/tmp/adm-sca.yaml")
          vwc = one(sca, "ValidatingWebhookConfiguration")
          assert vwc["metadata"]["annotations"] == {"service.beta.openshift.io/inject-cabundle": "true"}
          assert "caBundle" not in vwc["webhooks"][0]["clientConfig"]
          assert [m["name"] for m in vwc["webhooks"][0]["matchConditions"]] == ["not-an-openshift-namespace",
                                                                                 "not-owned-by-a-controller"]
          svc = one(sca, "Service", name)
          assert svc["metadata"]["annotations"] == {"service.beta.openshift.io/serving-cert-secret-name": name + "-tls"}
          assert "fsGroup" not in one(sca, "Deployment", name)["spec"]["template"]["spec"]["securityContext"]
          assert not [d for d in sca if d["kind"] in ("ClusterRole", "ClusterRoleBinding")], "no lookups, no RBAC"
          assert one(sca, "ServiceAccount", name)["automountServiceAccountToken"] is False
          assert one(sca, "NetworkPolicy", name)["spec"]["egress"] == [], "the webhook connects to nothing"
          cm = load("/tmp/adm-cm.yaml")
          assert one(cm, "ValidatingWebhookConfiguration")["metadata"]["annotations"] == {
              "cert-manager.io/inject-ca-from": "kube-noob/" + name}
          cert = one(cm, "Certificate", name)["spec"]
          assert cert["secretName"] == name + "-tls" and cert["issuerRef"]["name"] == "ca-issuer", cert
          assert cert["dnsNames"] == [name + ".kube-noob.svc", name + ".kube-noob.svc.cluster.local"], cert
          sec = load("/tmp/adm-secret.yaml")
          hook = one(sec, "ValidatingWebhookConfiguration")["webhooks"][0]
          assert hook["clientConfig"]["caBundle"] == "Zm9v" and "matchConditions" not in hook, "1.29: no matchConditions"
          vol = {v["name"]: v for v in one(sec, "Deployment", name)["spec"]["template"]["spec"]["volumes"]}
          assert vol["tls"]["secret"]["secretName"] == "kn-tls", vol
          role = one(sec, "ClusterRole")
          granted = {r for rule in role["rules"] for r in rule["resources"]}
          assert granted == {"poddisruptionbudgets", "networkpolicies", "persistentvolumeclaims",
                             "horizontalpodautoscalers", "storageclasses"}, granted
          assert all(rule["verbs"] == ["get", "list"] for rule in role["rules"])
          config = yaml.safe_load(one(sec, "ConfigMap", name)["data"]["config.yaml"])
          assert config["offline"] is True and config["cluster"]["enabled"] is True, config
          assert config["admission"]["lookups"] is True and config["admission"]["enforce"] == [], config
          print("::notice title=admission chart::three certificate modes render as expected")
          PY
          refuse() {
            if at "$@" > /tmp/refused.out 2>&1; then
              echo "::error title=admission chart::rendered with $*"; exit 1; fi
          }
          refuse --set admission.certificates=cert-manager
          refuse --set admission.certificates=secret --set admission.tls.secretName=kn-tls
          refuse --set admission.lookups=true
          refuse --set "admission.enforce={KN-X}"
          refuse --set admission.timeoutSeconds=31
          refuse --set admission.certificates=self-signed
          if helm template kn deploy/helm/kube-noob --set auth.existingSecret=kn-token | grep -q "kube-noob-admission"; then
            echo "::error title=admission chart::the webhook must be opt-in"; exit 1
          fi
      - name: Generated Helm charts render and audit clean
        run: |
          for p in kubernetes openshift rosa-hcp; do
            expose=route; [ "$p" = kubernetes ] && expose=ingress
            rm -rf /tmp/charts-$p && mkdir -p /tmp/charts-$p
            kube-noob helm-chart --name demo --namespace demo --image ghcr.io/example/demo:1.0.0 \
              --platform $p --expose $expose --host demo.example.com -o /tmp/charts-$p
            helm lint --strict /tmp/charts-$p/demo
            helm template demo /tmp/charts-$p/demo -n demo | kube-noob audit -f - --platform $p --fail-on high
          done

  db-image:
    # The public kube-noob-db image end to end: bundle, gate, image, the chart's cp init container (read-only, no
    # capabilities, user 1001) and the server importing the bundle on start.
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Bundle a small public corpus and gate it
        env:
          KUBE_NOOB_DATA_DIR: /tmp/db-data
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, shutil
          from importlib import resources
          from pathlib import Path
          from kube_noob.sources.corpus import write_shard

          data = Path("/tmp/db-data")
          doc = {"sourceId": "k8s-docs", "license": "CC-BY-4.0", "redistributable": True}
          write_shard(data, "k8s-docs", [{**doc, "id": f"k{i}", "title": f"doc {i}", "text": f"Pods {i}"} for i in range(5)])
          write_shard(data, "jira-ocpbugs", [{"id": "j1", "title": "t", "text": "PRIVATE", "sourceId": "jira:OCPBUGS",
                                              "license": "public, not redistributable", "redistributable": False}])
          (data / "known_issues").mkdir()
          src = resources.files("kube_noob").joinpath("data", "known_issues", "openshift-4.21-known-1.json")
          (data / "known_issues" / "openshift-4.21-known-1.json").write_text(src.read_text())
          PY
          mkdir -p dist/kube-noob-db
          kube-noob corpus db-bundle -o dist/kube-noob-db/kube-noob-db.tgz
          tar -xzf dist/kube-noob-db/kube-noob-db.tgz -C dist/kube-noob-db ATTRIBUTION.md
          kube-noob corpus db-check dist/kube-noob-db/kube-noob-db.tgz
          if tar -xzOf dist/kube-noob-db/kube-noob-db.tgz | grep -q PRIVATE; then
            echo "::error title=db::Jira text reached the public bundle"; exit 1; fi
      - name: Live Red Hat VEX (six CVEs, one over the size cap) joins the bundle under CC BY 4.0
        # Several OpenShift CVEs, so one document Red Hat withdraws or moves (CVE-2024-21626 answered 404 on
        # 2026-10-29) does not fail the check; it needs at least one published record that names OpenShift.
        env:
          KUBE_NOOB_DATA_DIR: /tmp/db-data
          CVES: CVE-2023-44487,CVE-2024-3094,CVE-2024-21626,CVE-2024-7387,CVE-2024-45496,CVE-2022-0811
        run: |
          set -euo pipefail
          kube-noob corpus advisories --online --cves "$CVES" --format json \
            > /tmp/vex.json 2> /tmp/vex.err || { echo "::error title=Red Hat VEX live::$(tr '\n' ' ' < /tmp/vex.err | cut -c1-1500)"; exit 1; }
          raw=$(curl -s --max-time 120 -o /tmp/vex-raw.json -w '%{http_code}' \
            https://security.access.redhat.com/data/csaf/v2/vex/2024/cve-2024-7387.json || true)
          echo "::notice title=VEX raw document::2024/cve-2024-7387.json HTTP ${raw}"
          python scripts/vex_ci_check.py /tmp/vex.json /tmp/db-data/corpus/redhat-vex.jsonl /tmp/vex-raw.json
          code=$(curl -s -o /dev/null -w '%{http_code}' https://security.access.redhat.com/data/csaf/v2/vex/archive_latest.txt)
          echo "::notice title=VEX archive pointer::archive_latest.txt HTTP $code"
          kube-noob corpus db-bundle -o dist/kube-noob-db/kube-noob-db.tgz
          kube-noob corpus db-check dist/kube-noob-db/kube-noob-db.tgz
          tar -xzf dist/kube-noob-db/kube-noob-db.tgz -C dist/kube-noob-db ATTRIBUTION.md
          grep -q "Red Hat Security Data" dist/kube-noob-db/ATTRIBUTION.md
      - name: Build both images
        run: |
          docker build -f Containerfile.db -t kube-noob-db:ci .
          docker build -f Containerfile -t kube-noob:ci .
          [ "$(docker image inspect kube-noob-db:ci --format '{{.Config.User}}')" = "1001" ]
      - name: The init container copies the archive and the server imports it on start
        run: |
          set -euo pipefail
          docker volume create kn-db-seed
          # an emptyDir is group-writable for the pod's group 0; a fresh docker volume is root-only until set so
          docker run --rm -v kn-db-seed:/kube-noob-db-seed --user 0 kube-noob-db:ci chmod 0770 /kube-noob-db-seed
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges --user 1001:0 \
            -v kn-db-seed:/kube-noob-db-seed kube-noob-db:ci \
            cp -- /kube-noob-db/kube-noob-db.tgz /kube-noob-db-seed/kube-noob-db.tgz
          docker run -d --name kn -e KUBE_NOOB_HTTP_TOKEN=ci-token -p 18080:8080 \
            -v kn-db-seed:/var/lib/kube-noob/seed-db:ro kube-noob:ci
          for _ in $(seq 60); do curl -fsS http://127.0.0.1:18080/healthz >/dev/null 2>&1 && break; sleep 1; done
          docker logs kn 2>&1 | tee /tmp/kn.log
          grep -q "kube-noob-db imported from /var/lib/kube-noob/seed-db/kube-noob-db.tgz" /tmp/kn.log
          docker exec kn kube-noob corpus stats --format json > /tmp/stats.json
          docker exec kn cat /var/lib/kube-noob/corpus/DB_SEED.json
          python -c "
          import json
          s = json.load(open('/tmp/stats.json'))
          assert 'k8s-docs' in json.dumps(s) and 'jira' not in json.dumps(s['manifest']['shards']), s
          "
          docker rm -f kn

  e2e-kind:
    # One leg per supported OpenShift minor (by its Kubernetes version) plus the newest Kubernetes kind ships.
    name: e2e-kind (OpenShift ${{ matrix.ocp }}, Kubernetes ${{ matrix.k8s }})
    runs-on: ubuntu-latest
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {ocp: "4.20", k8s: "1.33", kind: v0.32.0, kubectl: v1.33.12,
             node: "kindest/node:v1.33.12@sha256:3f5c8443c620245e4d355cfe09e96a91ead32ceaa569d3f1ca9edf0cb2fe2ff4"}
          - {ocp: "4.21", k8s: "1.34", kind: v0.33.0, kubectl: v1.34.11,
             node: "kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d"}
          - {ocp: "4.22", k8s: "1.35", kind: v0.33.0, kubectl: v1.35.8,
             node: "kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0"}
          - {ocp: "next", k8s: "1.37", kind: v0.33.0, kubectl: v1.37.1,
             node: "kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: kn
          version: ${{ matrix.kind }}
          node_image: ${{ matrix.node }}
          kubectl_version: ${{ matrix.kubectl }}
      - run: pip install -e .
      - name: Server-side dry-run of generated manifests
        run: |
          set -o pipefail
          dry() { kubectl apply --dry-run=server -f "$1" 2>&1 | tee /tmp/dry.out || { sed 's/^/::error title=dry-run::/' /tmp/dry.out; exit 1; }; }
          kubectl create namespace demo
          kube-noob generate --name web --namespace demo --image nginxinc/nginx-unprivileged:1.27.2 \
            --replicas 2 --expose ingress --host web.example.com -o /tmp/gen.yaml
          dry /tmp/gen.yaml
          kube-noob generate --name db --namespace demo --image registry.example.com/db:1.0.0 --workload statefulset \
            --storage-size 1Gi -o /tmp/sts.yaml
          dry /tmp/sts.yaml
      - name: Legacy (removed-API) bundle is migrated by `kube-noob fix` and accepted server-side
        run: |
          set -o pipefail
          kubectl create namespace shop
          if kubectl apply --dry-run=server -f tests/fixtures/legacy-bundle.yaml > /tmp/legacy.out 2>&1; then
            echo "::error::legacy bundle unexpectedly applied before migration"; exit 1; fi
          kube-noob fix -f tests/fixtures/legacy-bundle.yaml --platform kubernetes --version 1.35 -o /tmp/migrated.yaml
          kubectl apply --dry-run=server -f /tmp/migrated.yaml 2>&1 | tee /tmp/migrated.out \
            || { sed 's/^/::error title=migrated dry-run::/' /tmp/migrated.out; exit 1; }
      - name: Build image and load into kind
        run: |
          docker build -f Containerfile -t kube-noob:ci .
          kind load docker-image kube-noob:ci --name kn
      - name: The image answers from a local Red Hat Jira copy (SQLite FTS5 present)
        run: |
          set -euo pipefail
          mkdir -p /tmp/kn-tickets
          python - <<'PY'
          from pathlib import Path
          from kube_noob.sources.corpus import write_shard

          base = {"sourceId": "jira:OCPBUGS", "license": "public, not redistributable", "redistributable": False,
                  "issueType": "Bug", "status": "Closed", "retrievedAt": "2026-10-28T00:00:00Z"}
          recs = [{**base, "id": f"jira-OCPBUGS-{i}", "title": f"OCPBUGS-{i}: pod restarts {i}",
                   "text": f"Pod restarts in namespace team{i}", "resolution": "Done", "fixVersions": ["4.20.0"]}
                  for i in range(1, 80)]
          recs.append({**base, "id": "jira-OCPBUGS-900", "title": "OCPBUGS-900: router cannot load its certificate",
                       "text": "## Description\n\nhaproxy: unable to load default certificate file\n\n## Comments\n\n"
                               "Comment (2026-07-01): This is expected behavior: the secret was malformed.",
                       "resolution": "Not a Bug"})
          write_shard(Path("/tmp/kn-tickets"), "jira-ocpbugs", recs)
          PY
          chmod -R a+rwX /tmp/kn-tickets
          docker run --rm -e KUBE_NOOB_DATA_DIR=/data -v /tmp/kn-tickets:/data kube-noob:ci \
            known-issues "router: unable to load default certificate file" --platform openshift --format json \
            > /tmp/ki.json
          python -c "
          import json
          k = json.load(open('/tmp/ki.json'))
          top = k['matches'][0]
          assert top['id'] == 'OCPBUGS-900' and top['verdict'] == 'not-a-bug' and top['exactError'], top
          assert k['knowledge']['jiraTickets']['tickets'] == 80, k['knowledge']
          print('::notice title=Image ticket index::' + top['status'])
          "
      - name: Install chart with read-only cluster tools
        run: |
          kubectl create namespace kube-noob
          kubectl -n kube-noob create secret generic kn-token --from-literal=token=ci-token
          EP=$(kubectl get endpoints kubernetes -o jsonpath='{.subsets[0].addresses[0].ip}')
          SVC=$(kubectl get svc kubernetes -o jsonpath='{.spec.clusterIP}')
          helm install kn deploy/helm/kube-noob -n kube-noob \
            --set image.repository=kube-noob --set image.tag=ci --set image.pullPolicy=Never \
            --set auth.existingSecret=kn-token --set config.clusterEnabled=true --set "rbac.namespaces={demo}" \
            --set config.defaultPlatform=kubernetes --set networkPolicy.allowRouter=false \
            --set networkPolicy.egress.dnsNamespace=kube-system --set networkPolicy.egress.dnsPort=53 \
            --set "networkPolicy.egress.apiServerCIDRs={${EP}/32,${SVC}/32}" --wait --timeout 4m \
            || { kubectl -n kube-noob get events --sort-by=.lastTimestamp | tail -30 | sed 's/^/::error title=install::/'; exit 1; }
      - name: Helm test (in-cluster readiness through the Service)
        run: helm test kn -n kube-noob --timeout 3m --logs
      - name: Sealed private Jira seed, wrong key, sync on and off (requirements R1.4, R1.5)
        if: matrix.ocp == '4.22'
        run: bash scripts/e2e_jira_seed_kind.sh kube-noob:ci kn
      - name: Sidecar under Pod Security restricted (loopback only, transcript)
        run: scripts/demo_sidecar_kind.sh kube-noob:ci "/tmp/sidecar-transcript-${{ matrix.ocp }}.txt"
      - name: Publish the sidecar transcript as an annotation (source of the sidecar demo video)
        if: matrix.ocp == '4.22'
        run: echo "::notice title=sidecar transcript::$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' /tmp/sidecar-transcript-4.22.txt)"
      - name: The sidecar video's facts read from this transcript (limit as in the manifest, this version)
        if: matrix.ocp == '4.22'
        run: |
          python - <<'PY'
          import sys

          sys.path.insert(0, "demos/video")
          import facts
          import kube_noob

          f = facts.Facts("/tmp/sidecar-transcript-4.22.txt")
          values = {k: f.get(f"sidecar.{k}") for k in ("version", "tools", "peak", "limit")}
          print(f"::notice title=sidecar facts::{values}")
          if values["version"] != kube_noob.__version__:
              raise SystemExit(f"the transcript is of kube-noob {values['version']}, this commit is {kube_noob.__version__}")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sidecar-transcript-${{ matrix.ocp }}
          path: /tmp/sidecar-transcript-${{ matrix.ocp }}.txt
          if-no-files-found: ignore
      - name: Deploy a crashing workload to debug
        run: |
          kubectl -n demo create deployment crasher --image=busybox:1.36 -- sh -c 'echo starting; echo password=hunter2; exit 3'
          kubectl -n demo create secret generic do-not-read --from-literal=k=v
          sleep 45
          kubectl -n demo get pods
      - name: Incident watch finds and explains the crash loop and a Pod Security denial (read-only)
        run: |
          set -euo pipefail
          kubectl create namespace strict
          kubectl label namespace strict pod-security.kubernetes.io/enforce=restricted
          kubectl -n strict create deployment rooty --image=busybox:1.36 -- sleep 3600
          sleep 20
          export KUBE_NOOB_DATA_DIR=/tmp/kn-watch
          kube-noob --cluster-enabled --format json watch -n demo -n strict --once > /tmp/watch.json
          python - <<'PY'
          import json
          out = json.load(open("/tmp/watch.json"))
          rows = {(r["workload"], r["signal"]): r for r in out["open"]}
          assert out["errors"] == [], out["errors"]
          crash = rows.get(("deployment/crasher", "CrashLoopBackOff"))
          assert crash and crash["diagnosis"] == "DBG-CRASHLOOP", rows
          denied = rows.get(("deployment/rooty", "FailedCreate"))
          assert denied and "Pod Security" in denied["headline"], rows
          ledger = open("/tmp/kn-watch/incidents.json").read()
          assert "hunter2" not in ledger, "a secret from the crashing container's output reached the ledger"
          print(json.dumps(sorted(rows), indent=1))
          PY
          kube-noob incidents
      - name: MCP end-to-end over HTTP
        run: |
          kubectl -n kube-noob port-forward svc/kn-kube-noob 18080:8080 &
          sleep 5
          set -o pipefail
          python scripts/e2e_mcp_http.py --url http://127.0.0.1:18080/mcp --token ci-token \
            --cluster-namespace demo --cluster-deployment crasher 2>&1 | tee /tmp/e2e.out \
            || { echo "::error title=e2e::$(tail -60 /tmp/e2e.out | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"; exit 1; }
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A || true
          enc() { sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g'; }
          echo "::warning title=describe::$(kubectl -n kube-noob describe pods 2>&1 | tail -60 | enc)" || true
          echo "::warning title=logs::$(kubectl -n kube-noob logs deploy/kn-kube-noob --tail=80 2>&1 | enc)" || true

  gate-ci:
    # R4.3: the gate passes this repository's chart and fails on fixtures, as a GitHub Action, a Tekton Task (in
    # kind) and a GitLab CI template (run by gitlab-ci-local).
    runs-on: ubuntu-latest
    needs: [test]
    env:
      TEKTON_VERSION: v1.15.5
      # release.yaml of that version, as CI 40661279945 read it on first use; a different file fails the job
      TEKTON_SHA256: "c2fe5c2ac98af2984f2d58199e81ef2056802f671051744d986ec998ad19ba84"
      GITLAB_CI_LOCAL: gitlab-ci-local@4.76.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Values for rendering our chart
        run: |
          printf 'auth:\n  existingSecret: kn-token\n' > /tmp/kn-values.yaml
      - id: good
        name: GitHub Action on our own chart (must pass)
        uses: ./
        with:
          chart: deploy/helm/kube-noob
          values: /tmp/kn-values.yaml
          namespace: kube-noob
          containerfiles: Containerfile
          platform: openshift
          version: "4.20"
          sarif: /tmp/kn-good.sarif
      - id: bad
        name: GitHub Action on the bad fixtures (must fail)
        continue-on-error: true
        uses: ./
        with:
          paths: tests/fixtures/gate/bad
          containerfiles: tests/fixtures/containerfile/KN-B005.bad.Containerfile
          platform: openshift
          version: "4.20"
          sarif: /tmp/kn-bad.sarif
      - name: Scanner report fixtures for the vulnerability gate (R5.1-R5.3)
        run: python tests/fixtures/vuln/generate.py /tmp/kn-vuln
      - id: vuln
        name: GitHub Action with a scanner report, VEX and KEV (must fail on fixable criticals)
        continue-on-error: true
        uses: ./
        with:
          paths: tests/fixtures/vuln/shop.yaml
          scanner-reports: /tmp/kn-vuln/trivy.json
          vex: /tmp/kn-vuln/vex
          kev: /tmp/kn-vuln/kev.json
          platform: openshift
          version: "4.20"
          fail-on: critical
          sarif: /tmp/kn-vuln.sarif
      - name: SAST fixtures for the code gate (R4.5)
        run: python tests/fixtures/code/generate.py /tmp/kn-code
      - id: code
        name: GitHub Action with SARIF from five SAST tools (must fail on shipped highs)
        continue-on-error: true
        uses: ./
        with:
          sarif-reports: >-
            /tmp/kn-code/semgrep.sarif /tmp/kn-code/bandit.sarif /tmp/kn-code/spotbugs.sarif
            /tmp/kn-code/eslint.sarif /tmp/kn-code/codeql.sarif
          platform: openshift
          version: "4.20"
          fail-on: high
          sarif: /tmp/kn-code.sarif
      - name: The action's verdicts and SARIF 2.1.0 schema
        env:
          GOOD: ${{ steps.good.outputs.result }}
          BAD: ${{ steps.bad.outputs.result }}
          VULN: ${{ steps.vuln.outputs.result }}
          CODE: ${{ steps.code.outputs.result }}
        run: |
          set -euo pipefail
          test "$GOOD" = passed || { echo "::error title=gate action::our chart: $GOOD"; exit 1; }
          test "$BAD" = failed || { echo "::error title=gate action::bad fixtures: $BAD"; exit 1; }
          test "$VULN" = failed || { echo "::error title=gate action::scanner report: $VULN"; exit 1; }
          test "$CODE" = failed || { echo "::error title=gate action::SARIF input: $CODE"; exit 1; }
          python -m pip install --quiet check-jsonschema==0.38.2
          check-jsonschema --schemafile https://json.schemastore.org/sarif-2.1.0.json /tmp/kn-good.sarif /tmp/kn-bad.sarif \
            /tmp/kn-vuln.sarif /tmp/kn-code.sarif
          python -c "
          import json
          bad = json.load(open('/tmp/kn-bad.sarif'))['runs'][0]['results']
          print('::notice title=gate action::our chart passed; bad fixtures failed with', len(bad), 'SARIF results')
          cves = {r['ruleId'] for r in json.load(open('/tmp/kn-vuln.sarif'))['runs'][0]['results'] if r['ruleId'].startswith('CVE-')}
          exp = json.load(open('/tmp/kn-vuln/expected.json'))
          want = {n['cve'] for n in exp['kept']}
          dropped = {c for _, c in exp['excluded']}
          assert cves == want, (sorted(cves ^ want))
          assert not cves & dropped, sorted(cves & dropped)
          print('::notice title=gate action::scanner report: failed as planned;', len(cves), 'CVEs in SARIF after VEX dropped', len(dropped))
          code = {r['ruleId'] for r in json.load(open('/tmp/kn-code.sarif'))['runs'][0]['results']}
          assert {'B602', 'no-unsanitized/property', 'security/detect-child-process'} <= code, sorted(code)
          assert 'no-unused-vars' not in code and 'security/detect-eval-with-expression' not in code, sorted(code)
          print('::notice title=gate action::SARIF input: failed as planned;', len(code), 'code findings (suppressed, fixed and lint left out)')
          "
      - name: Build the image the Tekton Task and the GitLab template run
        run: |
          docker build -f Containerfile -t kube-noob:ci .
          docker tag kube-noob:ci "ghcr.io/kube-noob/kube-noob:$(python -c 'import re;print(re.search(r"__version__ = \"([^\"]+)\"", open("src/kube_noob/__init__.py").read()).group(1))')"
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: kn
          version: v0.32.0
          node_image: "kindest/node:v1.33.12@sha256:3f5c8443c620245e4d355cfe09e96a91ead32ceaa569d3f1ca9edf0cb2fe2ff4"
          kubectl_version: v1.33.12
      - name: Install Tekton Pipelines
        run: |
          set -euo pipefail
          url="https://github.com/tektoncd/pipeline/releases/download/${TEKTON_VERSION}/release.yaml"
          curl -fsSL --retry 3 -o /tmp/tekton.yaml "$url"
          got=$(sha256sum /tmp/tekton.yaml | cut -d' ' -f1)
          if [ "$got" != "$TEKTON_SHA256" ]; then
            echo "::error title=Tekton release.yaml::sha256 ${got} differs from the pinned ${TEKTON_SHA256}"; exit 1
          fi
          kubectl apply -f /tmp/tekton.yaml > /tmp/tekton.out 2>&1 \
            || { echo "::error title=Tekton install::$(tail -c 1500 /tmp/tekton.out | tr '\n' ' ')"; exit 1; }
          kubectl -n tekton-pipelines rollout status deploy/tekton-pipelines-controller --timeout=300s
          kubectl -n tekton-pipelines rollout status deploy/tekton-pipelines-webhook --timeout=300s
          kind load docker-image kube-noob:ci --name kn
      - name: Tekton Task on our chart (must pass) and on the bad fixtures (must fail)
        run: |
          set -euo pipefail
          kubectl apply -f deploy/tekton/kube-noob-gate.yaml
          helm template kn deploy/helm/kube-noob -n kube-noob -f /tmp/kn-values.yaml > /tmp/kn-chart.yaml
          kubectl create configmap gate-good --from-file=chart.yaml=/tmp/kn-chart.yaml --from-file=Containerfile=Containerfile
          kubectl create configmap gate-bad --from-file=tests/fixtures/gate/bad/ \
            --from-file=Containerfile=tests/fixtures/containerfile/KN-B005.bad.Containerfile
          for case in good bad; do
            cat <<EOF | kubectl create -f -
          apiVersion: tekton.dev/v1
          kind: TaskRun
          metadata: {name: gate-${case}}
          spec:
            taskRef: {name: kube-noob-gate}
            params:
              - {name: image, value: kube-noob:ci}
              - {name: paths, value: "."}
              - {name: containerfiles, value: Containerfile}
              - {name: platform, value: openshift}
              - {name: version, value: "4.20"}
            workspaces:
              - {name: source, configMap: {name: gate-${case}}}
          EOF
          done
          for case in good bad; do
            kubectl wait "taskrun/gate-${case}" --for=condition=Succeeded=Unknown --timeout=5s >/dev/null 2>&1 || true
            for i in $(seq 1 90); do
              s=$(kubectl get "taskrun/gate-${case}" -o jsonpath='{.status.conditions[0].status}')
              [ "$s" = True ] || [ "$s" = False ] && break
              sleep 5
            done
          done
          good=$(kubectl get taskrun/gate-good -o jsonpath='{.status.results[?(@.name=="result")].value}')
          bad=$(kubectl get taskrun/gate-bad -o jsonpath='{.status.results[?(@.name=="result")].value}')
          counts=$(kubectl get taskrun/gate-bad -o jsonpath='{.status.results[?(@.name=="counts")].value}')
          echo "::notice title=Tekton gate::good=${good} bad=${bad} counts=${counts}"
          test "$good" = passed && test "$bad" = failed \
            || { kubectl get taskrun -o yaml | tail -80 | sed 's/^/::warning title=taskrun::/'; exit 1; }
      - name: GitLab CI template under gitlab-ci-local (must pass on the chart, fail on the fixtures)
        run: |
          set -euo pipefail
          cp /tmp/kn-chart.yaml rendered-chart.yaml
          cat > .gitlab-ci-gate.yml <<'EOF'
          include:
            - local: deploy/gitlab/kube-noob-gate.gitlab-ci.yml
          gate-good:
            extends: .kube-noob-gate
            variables: {KUBE_NOOB_PATHS: rendered-chart.yaml, KUBE_NOOB_CONTAINERFILES: Containerfile, KUBE_NOOB_PLATFORM: openshift, KUBE_NOOB_VERSION: "4.20"}
          gate-bad:
            extends: .kube-noob-gate
            variables: {KUBE_NOOB_PATHS: tests/fixtures/gate/bad, KUBE_NOOB_CONTAINERFILES: tests/fixtures/containerfile/KN-B005.bad.Containerfile, KUBE_NOOB_PLATFORM: openshift, KUBE_NOOB_VERSION: "4.20"}
          EOF
          git add -f rendered-chart.yaml .gitlab-ci-gate.yml  # in the index only, in case untracked files are not copied
          npx --yes "$GITLAB_CI_LOCAL" --file .gitlab-ci-gate.yml gate-good > /tmp/gl-good.out 2>&1 \
            || { tail -c 2000 /tmp/gl-good.out | tr '\n' ' ' | sed 's/^/::error title=gitlab good::/'; exit 1; }
          rc=0
          npx --yes "$GITLAB_CI_LOCAL" --file .gitlab-ci-gate.yml gate-bad > /tmp/gl-bad.out 2>&1 || rc=$?
          test "$rc" != 0 || { echo "::error title=gitlab bad::the bad fixtures passed"; exit 1; }
          grep -q "kube-noob gate failed" /tmp/gl-bad.out \
            || { tail -c 2000 /tmp/gl-bad.out | tr '\n' ' ' | sed 's/^/::error title=gitlab bad output::/'; exit 1; }
          echo "::notice title=GitLab gate::chart passed, fixtures failed (exit ${rc})"

  admission-kind:
    # R3.3 acceptance on a real API server: in warn mode kube-noob's findings come back as kubectl warnings and the
    # object is admitted; fuzzed reviews sent from inside the cluster are never denied and 50 requests per second for
    # 30 seconds answer with p99 under 50 ms; in enforce mode only the listed rule is denied, and an object that already
    # broke it can still be updated; a webhook scaled to zero blocks nothing.
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: kn
          version: v0.32.0
          node_image: "kindest/node:v1.33.12@sha256:3f5c8443c620245e4d355cfe09e96a91ead32ceaa569d3f1ca9edf0cb2fe2ff4"
          kubectl_version: v1.33.12
      - name: Build image and load into kind
        run: |
          docker build -f Containerfile -t kube-noob:ci .
          kind load docker-image kube-noob:ci --name kn
      - name: Serving certificate from a CA made here (openssl; the CA key never leaves the runner)
        run: |
          set -euo pipefail
          d=$(mktemp -d)
          svc=kn-kube-noob-admission.kube-noob.svc
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$d/ca.key" -out "$d/ca.crt" -days 2 \
            -subj "/CN=kube-noob-ci-ca" -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign" -addext "subjectKeyIdentifier=hash"
          openssl req -newkey rsa:2048 -nodes -keyout "$d/tls.key" -out "$d/tls.csr" -subj "/CN=$svc"
          printf '%s\n' "basicConstraints=CA:FALSE" "keyUsage=critical,digitalSignature,keyEncipherment" \
            "extendedKeyUsage=serverAuth" "subjectKeyIdentifier=hash" "authorityKeyIdentifier=keyid,issuer" \
            "subjectAltName=DNS:$svc,DNS:$svc.cluster.local" > "$d/ext.cnf"
          openssl x509 -req -in "$d/tls.csr" -CA "$d/ca.crt" -CAkey "$d/ca.key" -CAcreateserial -out "$d/tls.crt" \
            -days 2 -extfile "$d/ext.cnf"
          kubectl create namespace kube-noob
          kubectl -n kube-noob create secret tls kn-admission-tls --cert="$d/tls.crt" --key="$d/tls.key"
          kubectl -n kube-noob create secret generic kn-token --from-literal=token=ci-token
          kubectl create namespace loadtest
          kubectl -n loadtest create configmap admission-ca --from-file=ca.crt="$d/ca.crt"
          kubectl -n loadtest create configmap admission-load --from-file=scripts/admission_kind_load.py
          echo "CA_BUNDLE=$(base64 -w0 "$d/ca.crt")" >> "$GITHUB_ENV"
      - name: Install the chart with the webhook in warn mode
        run: |
          set -euo pipefail
          helm install kn deploy/helm/kube-noob -n kube-noob \
            --set image.repository=kube-noob --set image.tag=ci --set image.pullPolicy=Never \
            --set auth.existingSecret=kn-token --set config.defaultPlatform=kubernetes \
            --set networkPolicy.allowRouter=false --set networkPolicy.egress.dnsNamespace=kube-system \
            --set networkPolicy.egress.dnsPort=53 --set admission.enabled=true --set admission.certificates=secret \
            --set admission.tls.secretName=kn-admission-tls --set "admission.tls.caBundle=$CA_BUNDLE" \
            --wait --timeout 5m \
            || { kubectl -n kube-noob get events --sort-by=.lastTimestamp | tail -30 | sed 's/^/::error title=install::/'; exit 1; }
          kubectl -n kube-noob rollout status deploy/kn-kube-noob-admission --timeout=180s
      - name: Warn mode - a privileged Deployment is admitted with KN-S001 as a kubectl warning
        run: |
          set -euo pipefail
          kubectl create namespace shop
          cat > /tmp/priv.yaml <<'Y'
          apiVersion: apps/v1
          kind: Deployment
          metadata: {name: priv, namespace: shop}
          spec:
            replicas: 1
            selector: {matchLabels: {app: priv}}
            template:
              metadata: {labels: {app: priv}}
              spec:
                containers:
                  - name: c
                    image: registry.k8s.io/pause:3.10
                    securityContext: {privileged: true}
          Y
          for i in $(seq 1 45); do
            kubectl apply --dry-run=server -f /tmp/priv.yaml > /tmp/warn.out 2>&1 || true
            grep -q 'Warning: \[KN-S001\]' /tmp/warn.out && break
            sleep 2
          done
          grep -q 'Warning: \[KN-S001\]' /tmp/warn.out \
            || { echo "::error title=warn mode::no KN-S001 warning: $(tr '\n' ' ' < /tmp/warn.out)"; exit 1; }
          kubectl apply -f /tmp/priv.yaml 2>&1 | tee /tmp/applied.out
          grep -q 'deployment.apps/priv created' /tmp/applied.out
          echo "::notice title=warn mode::$(grep -m1 'KN-S001' /tmp/warn.out | cut -c1-200)"
          kubectl create namespace quiet
          kubectl label namespace quiet kube-noob.io/admission=disabled
          sed 's/namespace: shop/namespace: quiet/' /tmp/priv.yaml | kubectl apply --dry-run=server -f - > /tmp/quiet.out 2>&1
          if grep -q 'KN-' /tmp/quiet.out; then echo "::error title=opt-out::a disabled namespace was reviewed"; exit 1; fi
          sed 's/namespace: shop/namespace: kube-noob/' /tmp/priv.yaml | kubectl apply --dry-run=server -f - > /tmp/own.out 2>&1
          if grep -q 'KN-' /tmp/own.out; then echo "::error title=own namespace::the release namespace was reviewed"; exit 1; fi
      - name: In-cluster fuzz (never denied in warn mode) and 50 requests/s for 30 s (p99 under 50 ms)
        run: |
          set -euo pipefail
          cat <<'Y' | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata: {name: admission-load, namespace: loadtest}
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                automountServiceAccountToken: false
                securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
                containers:
                  - name: load
                    image: kube-noob:ci
                    imagePullPolicy: Never
                    command: ["python3", "/scripts/admission_kind_load.py",
                              "https://kn-kube-noob-admission.kube-noob.svc/validate", "/ca/ca.crt",
                              "--fuzz", "600", "--rate", "50", "--seconds", "30", "--p99-ms", "50"]
                    resources:
                      requests: {cpu: 200m, memory: 128Mi}
                      limits: {memory: 512Mi}
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities: {drop: [ALL]}
                    volumeMounts:
                      - {name: script, mountPath: /scripts, readOnly: true}
                      - {name: ca, mountPath: /ca, readOnly: true}
                volumes:
                  - name: script
                    configMap: {name: admission-load}
                  - name: ca
                    configMap: {name: admission-ca}
          Y
          ok=0
          kubectl -n loadtest wait --for=condition=complete job/admission-load --timeout=300s && ok=1 || true
          kubectl -n loadtest logs job/admission-load > /tmp/load.out 2>&1 || true
          cat /tmp/load.out
          [ "$ok" = 1 ] || { echo "::error title=fuzz and load::$(tr '\n' ' ' < /tmp/load.out | cut -c1-1500)"; exit 1; }
          echo "::notice title=fuzz and load::$(head -1 /tmp/load.out)"
          kubectl -n kube-noob port-forward svc/kn-kube-noob-admission 18443:443 > /dev/null 2>&1 &
          sleep 3
          echo "::notice title=metrics::$(curl -sk https://127.0.0.1:18443/metrics | grep -E '^kube_noob_admission_requests_total' | tr '\n' ' ' | cut -c1-600)"
          kill %1 || true
      - name: Enforce mode - KN-S001 is denied, other findings warn, an existing breaker can still be updated
        run: |
          set -euo pipefail
          helm upgrade kn deploy/helm/kube-noob -n kube-noob --reuse-values --set "admission.enforce={KN-S001}" \
            --wait --timeout 5m
          kubectl -n kube-noob rollout status deploy/kn-kube-noob-admission --timeout=180s
          sed 's/name: priv,/name: priv2,/' /tmp/priv.yaml > /tmp/priv2.yaml
          for i in $(seq 1 45); do
            if ! kubectl apply --dry-run=server -f /tmp/priv2.yaml > /tmp/deny.out 2>&1 && grep -q 'KN-S001' /tmp/deny.out; then
              break; fi
            sleep 2
          done
          grep -q 'denied the request: kube-noob denied Deployment/shop/priv2: \[KN-S001\]' /tmp/deny.out \
            || { echo "::error title=enforce::not denied: $(tr '\n' ' ' < /tmp/deny.out)"; exit 1; }
          echo "::notice title=enforce::$(head -c 300 /tmp/deny.out)"
          sed 's/privileged: true/privileged: false/; s/name: priv,/name: plain,/' /tmp/priv.yaml \
            | kubectl apply --dry-run=server -f - > /tmp/plain.out 2>&1 \
            || { echo "::error title=enforce::a Deployment without KN-S001 was denied: $(tr '\n' ' ' < /tmp/plain.out)"; exit 1; }
          grep -q 'Warning: \[KN-' /tmp/plain.out || { echo "::error title=enforce::other findings stopped warning"; exit 1; }
          kubectl -n shop label deployment priv touched=yes --dry-run=server > /tmp/update.out 2>&1 \
            || { echo "::error title=enforce::updating a Deployment that already broke KN-S001 was denied: $(tr '\n' ' ' < /tmp/update.out)"; exit 1; }
      - name: A webhook scaled to zero blocks nothing (failurePolicy Ignore)
        run: |
          set -euo pipefail
          kubectl -n kube-noob scale deploy/kn-kube-noob-admission --replicas=0
          for i in $(seq 1 60); do
            [ -z "$(kubectl -n kube-noob get pods -l app.kubernetes.io/name=kube-noob-admission -o name)" ] && break
            sleep 2
          done
          [ -z "$(kubectl -n kube-noob get pods -l app.kubernetes.io/name=kube-noob-admission -o name)" ]
          start=$(date +%s)
          kubectl apply --dry-run=server -f /tmp/priv2.yaml 2>&1 | tee /tmp/dead.out
          took=$(( $(date +%s) - start ))
          [ "$took" -lt 15 ] || { echo "::error title=dead webhook::admission took ${took}s"; exit 1; }
          echo "::notice title=dead webhook::admitted in ${took}s with the webhook down"
      - name: Diagnostics on failure
        if: failure()
        run: |
          enc() { sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g'; }
          echo "::warning title=pods::$(kubectl get pods -A 2>&1 | tail -40 | enc)" || true
          echo "::warning title=webhook logs::$(kubectl -n kube-noob logs deploy/kn-kube-noob-admission --tail=80 2>&1 | enc)" || true
          echo "::warning title=webhook describe::$(kubectl -n kube-noob describe pods -l app.kubernetes.io/name=kube-noob-admission 2>&1 | tail -60 | enc)" || true
          echo "::warning title=vwc::$(kubectl get validatingwebhookconfigurations -o yaml 2>&1 | head -80 | enc)" || true

  policy-kind:
    # R3.1 acceptance: each generated admission policy refuses its rule's bad fixture and admits the good one on a real
    # API server (server-side dry-run), for the built-in ValidatingAdmissionPolicy and for Kyverno ValidatingPolicy.
    name: policy-kind (${{ matrix.engine }})
    runs-on: ubuntu-latest
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        engine: [vap, kyverno]
    env:
      KYVERNO_VERSION: v1.19.1
      # install.yaml of that release, first read by run 40646897729 (GitHub's runner) and pinned here
      KYVERNO_SHA256: d3322cb346d3d42dd0f41e230b0d1d7bc5619960e1c36fdac4d9151d724b88e6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: kn
          version: v0.32.0
          node_image: "kindest/node:v1.33.12@sha256:3f5c8443c620245e4d355cfe09e96a91ead32ceaa569d3f1ca9edf0cb2fe2ff4"
          kubectl_version: v1.33.12
      - run: pip install -e .
      - name: Install Kyverno
        if: matrix.engine == 'kyverno'
        run: |
          set -euo pipefail
          url="https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/install.yaml"
          curl -fsSL --retry 3 -o /tmp/kyverno-install.yaml "$url"
          echo "${KYVERNO_SHA256}  /tmp/kyverno-install.yaml" | sha256sum -c - \
            || { echo "::error title=Kyverno install.yaml::sha256 differs from the pinned ${KYVERNO_SHA256}"; exit 1; }
          kubectl create -f /tmp/kyverno-install.yaml > /tmp/kyverno.out 2>&1 \
            || { echo "::error title=Kyverno install::$(tail -c 1500 /tmp/kyverno.out | tr '\n' ' ')"; exit 1; }
          kubectl -n kyverno rollout status deploy/kyverno-admission-controller --timeout=300s
          kubectl get crd validatingpolicies.policies.kyverno.io
      - name: Generated policies on the API server
        run: python scripts/policy_kind_test.py --engine ${{ matrix.engine }}
      - name: Attack-path scan ranks the planted path first, reading no Secrets (R3.2)
        if: matrix.engine == 'vap'
        run: python scripts/posture_kind_test.py
      - name: Diagnostics on failure
        if: failure()
        run: |
          enc() { sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g'; }
          echo "::warning title=pods::$(kubectl get pods -A 2>&1 | tail -40 | enc)" || true
          echo "::warning title=kyverno logs::$(kubectl -n kyverno logs deploy/kyverno-admission-controller --tail=60 2>&1 | enc)" || true
