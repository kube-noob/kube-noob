name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: ruff check src tests scripts skill
      - run: ruff format --check src tests scripts skill
      - run: mypy
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.lock --require-hashes --disable-pip --strict

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is a shipped target that nothing here used to run: the plugin's `uv run` may pick it, and the
        # WebAssembly runtime behind kube-noob.com's playground is 3.14. What differs there is json.loads: from
        # 3.14 sys.getrecursionlimit() no longer bounds it, so the depth at which it gives up is whatever the C
        # stack allows -- 10 000 levels parse on 3.14.6 at the default limit of 1000, and whether 100 000 fails
        # depends on the machine, which is why this job once saw a bomb parse that a smaller container refuses.
        # Every reader of untrusted JSON now counts brackets first (sanitize.loads_bounded), so the refusal is the
        # same everywhere. Advisory until it has had one green run on a runner with every optional dependency
        # installed, then drop the continue-on-error below.
        python: ["3.11", "3.12", "3.13", "3.14"]
    continue-on-error: ${{ matrix.python == '3.14' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: pytest --cov --cov-report=term-missing:skip-covered --cov-fail-under=80
      - name: Build sdist + wheel
        run: python -m build
      - name: Install wheel in a clean venv and smoke-test
        run: |
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/pip install dist/*.whl
          /tmp/wheelenv/bin/kube-noob --version
          /tmp/wheelenv/bin/kube-noob search "restricted-v2" --format json | python -c "import json,sys; assert json.load(sys.stdin)['results']"
          cd /tmp && /tmp/wheelenv/bin/kube-noob demo all > /tmp/demo.out && grep -q "kube-noob demo: Show and lock" /tmp/demo.out
      - name: MCP stdio end-to-end under the offline lock (installed wheel)
        run: /tmp/wheelenv/bin/python -I scripts/e2e_mcp_offline.py /tmp/wheelenv/bin/kube-noob

  videos:
    # The demo videos on every change, in a few minutes and without the voice model (a silent voice with the same
    # timing): videos.json against its schema with every number filled from this commit's code, the brand layout
    # rules on every frame (capture.js --check), and stills of every scene, the walkthrough cards and the thumbnail
    # uploaded to look at. The 4K masters are rendered for releases by videos.yml.
    runs-on: ubuntu-latest
    # 36, not 30, because the per-step budgets below have to fit inside it or a step timeout could never be the
    # thing that fires -- and the ffmpeg budget had to grow once a real mirror stall was measured.
    timeout-minutes: 36
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # One command per step, each bounded, because a job timeout is not a diagnosis. The first version of this
      # was one 12-minute install step and it died at its own limit, which said only "something in here hangs".
      # Measured on this code: pip 20s, npm ci 3s, the whole render about 90 seconds (voiceover 7-17s per video,
      # capture --check 6-9s, stills 5-7s, walkthrough and thumbnail 11s, 23 stills out). So the hang is in one
      # of the two commands that cannot be measured off a runner -- apt, or the browser download -- and these
      # steps name which.
      - name: kube-noob and its video dependencies
        timeout-minutes: 6
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip && pip install . "numpy==2.5.3" "pytest>=8.3"
      # DPkg::Lock::Timeout is the fix for the known runner hang: unattended-upgrades holds the dpkg lock and
      # apt-get waits for it forever by default. DEBIAN_FRONTEND needs `sudo -E`, which plain sudo would drop.
      # The 4-minute bound this step used to carry was guessed, not measured -- the measurements above cover pip,
      # npm and the render, and apt was named as the thing they could not measure. On 2026-11-05 at 21:19Z the
      # Azure Ubuntu mirror served libflite1 (13.6 MB) in 62 seconds and the step was still downloading when the
      # bound killed it, so a slow third-party mirror became a red pull request on a green commit. Three changes,
      # cheapest first: skip apt entirely when the runner image already ships ffmpeg; let apt retry a dropped
      # connection itself; and try twice before giving up. The bound stays -- an unbounded apt is the hang this
      # job was split up to find -- but it is now above the slowest transfer actually observed, not below it.
      - name: ffmpeg
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          if command -v ffmpeg > /dev/null; then
            ffmpeg -version | head -1
            exit 0
          fi
          apt=(sudo -E apt-get -q -o DPkg::Lock::Timeout=180 -o Acquire::Retries=3)
          "${apt[@]}" update
          for attempt in 1 2; do
            if "${apt[@]}" install -y ffmpeg; then exit 0; fi
            echo "apt attempt $attempt failed; the mirror may be slow or a package may have moved"
            "${apt[@]}" update || true
          done
          exit 1
      - name: Video node modules (pinned in demos/video/package-lock.json)
        timeout-minutes: 4
        run: cd demos/video && npm ci --ignore-scripts --no-audit --no-fund
      # `--with-deps` is deliberately NOT used: it shells out to apt a second time, inside Playwright's own sudo
      # where neither DEBIAN_FRONTEND nor the lock timeout above reaches it. The ubuntu-latest image already
      # carries Chromium's libraries, and if one is ever missing the render step fails in seconds naming the
      # library -- a loud failure, where an unbounded apt was a silent one.
      - name: Chromium for Playwright (no apt)
        timeout-minutes: 6
        run: cd demos/video && timeout 300 npx playwright install chromium
      - name: Video tests with ffmpeg (loudness, captions, facts, brand)
        timeout-minutes: 4
        run: python -m pytest -q tests/test_video_loudness.py tests/test_video_captions.py tests/test_video_facts.py tests/test_brand.py tests/test_video_workflows.py tests/test_video_voice.py
      - name: Video scripts, facts and layout rules on every frame, and stills (silent voice)
        timeout-minutes: 6
        env:
          NODE_PATH: ${{ github.workspace }}/demos/video/node_modules
          KN_SIDECAR_TRANSCRIPT: ${{ github.workspace }}/tests/fixtures/video-sidecar-transcript.txt
        run: |
          set -euo pipefail
          for v in teaser sidecar mcp; do
            python demos/video/stage/voiceover.py "$v" "out/$v" --engine silent
            node demos/video/stage/capture.js "out/$v" --check
            stills="$(python -c "import json; t = json.load(open('out/$v/timeline.json')); print(','.join(str(round(s['start'] + s['dur'] * 0.8, 2)) for s in t['scenes']))")"
            node demos/video/stage/capture.js "out/$v" --scale 1 --stills "$stills"
          done
          python demos/video/build_scenes.py walkthrough out/walkthrough
          node demos/video/capture_page.js out/walkthrough walkthrough.html out/walkthrough/unused.mp4 --scale 1 --stills 2.5,20
          cp demos/video/thumbnail.html out/walkthrough/ && node demos/video/thumbnail.js out/walkthrough
          ls out/*/still-*.png | wc -l
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: video-stills
          path: |
            out/*/still-*.png
            out/walkthrough/youtube-thumbnail.jpg
          retention-days: 7
          if-no-files-found: ignore

  plugin:
    # The Claude plugin runs the bundled server source with dependencies pinned by hash; prove it starts and answers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Plugin server copy matches src
        run: python scripts/sync_plugin_server.py --check
      - name: Safety contract matches the code and its invariants hold
        run: python scripts/safety_contract.py --check
      - name: Agent Skill is valid and its tool reference matches the code
        run: python scripts/build_skill.py --check
      - name: Compliance document's rule and control tables match the code
        run: python scripts/compliance_doc.py --check
      - name: Documented measurements match what the commands produce
        run: python scripts/doc_numbers.py --check
      - name: FedRAMP KSI crosswalk matches the vendored dataset
        run: python scripts/fedramp_ksi.py --check
      - name: Plugin lock matches its pyproject
        run: uv lock --check --project plugin/kube-noob --default-index https://pypi.org/simple
      - name: Plugin dependency vulnerability audit
        run: |
          uv export --project plugin/kube-noob --frozen --no-emit-project --format requirements-txt -o /tmp/plugin-requirements.txt
          pip-audit -r /tmp/plugin-requirements.txt --require-hashes --disable-pip --strict
      - name: Plugin MCP server end to end (as .mcp.json runs it)
        run: python scripts/e2e_plugin.py
      - name: Formula matches the PyPI release files
        run: python scripts/brew_formula.py --check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: OSCAL output validates against the pinned NIST schema (ajv, not jsonschema)
        run: |
          npm install --no-save --no-audit --no-fund ajv@8.17.1 ajv-formats@3.0.1 ajv-draft-04@1.0.0
          python -m kube_noob audit -f examples/insecure-deployment.yaml --platform openshift --version 4.22 \
            --oscal > /tmp/assessment-results.json || true
          node scripts/json_schema_validate.mjs tests/fixtures/oscal/oscal_assessment-results_schema.json \
            /tmp/assessment-results.json
      - name: SARIF output validates against the OASIS schema it names
        run: |
          python -m kube_noob gate -f examples/insecure-deployment.yaml --platform openshift --version 4.22 \
            --sarif /tmp/gate.sarif.json --quiet || true
          node scripts/json_schema_validate.mjs tests/fixtures/sarif/sarif-schema-2.1.0.json /tmp/gate.sarif.json
      - name: The schema checks ran rather than skipping for a missing ajv
        run: |
          out=$(python -m pytest tests/test_oscal.py tests/test_gate_sarif.py -q -rs 2>&1)
          echo "$out" | tail -5
          echo "$out" | grep -q "ajv is not installed" && { echo "a schema test SKIPPED"; exit 1; }
          echo "$out" | grep -qE "[0-9]+ passed" || exit 1

  publishable:
    # Upload validation exactly as pypa/gh-action-pypi-publish runs it: same twine, same Python as its container.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: action
        run: echo "python=$(scripts/check_publishable.sh --python-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.action.outputs.python }}
      - run: python -m pip install --upgrade pip build && python -m build
      - run: scripts/check_publishable.sh

  helm-and-dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: pip install -e .
      - name: Lint the kube-noob chart
        run: helm lint --strict deploy/helm/kube-noob --set auth.existingSecret=kn-token
      - name: Audit our own chart (Kubernetes)
        run: |
          helm template kn deploy/helm/kube-noob -n kube-noob --set auth.existingSecret=kn-token \
            --set networkPolicy.allowRouter=false --set networkPolicy.allowIngressNamespace=ingress-nginx \
            | kube-noob audit -f - --platform kubernetes --fail-on medium
      - name: Audit our own chart (OpenShift 4.20, 4.21, 4.22, Route, live cluster tools, EgressFirewall)
        run: |
          set -euo pipefail
          for v in 4.20:1.33.0 4.21:1.34.0 4.22:1.35.0; do
            helm template kn deploy/helm/kube-noob -n kube-noob --kube-version "${v#*:}" \
              --set auth.existingSecret=kn-token --set route.enabled=true \
              --set route.host=kn-kube-noob.apps.example.com --set config.clusterEnabled=true \
              --set config.webEnabled=true --set egressFirewall.enabled=true \
              --set "networkPolicy.egress.apiServerCIDRs={172.30.0.1/32}" \
              | kube-noob audit -f - --platform openshift --version "${v%%:*}" --fail-on medium
          done
      - name: Audit our own Containerfiles; find a credential planted in a real image and deleted by a later layer
        run: |
          set -euo pipefail
          trap 'echo "::error title=image audit::line $LINENO: $BASH_COMMAND"' ERR
          helm template kn deploy/helm/kube-noob --set auth.existingSecret=kn-token > /tmp/kn-chart.yaml
          for f in Containerfile Containerfile.db Containerfile.seed; do
            kube-noob build audit -f "$f" --context . --manifests /tmp/kn-chart.yaml --fail-on high --format text
          done
          work=$(mktemp -d)
          head="-----BEGIN OPEN""SSH PRIVATE KEY-----"
          printf '%s\nb3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQ\n-----END OPENSSH PRIVATE KEY-----\n' "$head" > "$work/id_rsa"
          printf 'FROM registry.access.redhat.com/ubi9/ubi-minimal:latest\nCOPY id_rsa /root/.ssh/id_rsa\nRUN rm /root/.ssh/id_rsa\nUSER 1001\n' > "$work/Containerfile"
          docker build -q -t kn-planted:1 -f "$work/Containerfile" "$work"
          mkdir "$work/layout"
          docker save kn-planted:1 | tar -x -C "$work/layout"
          ls "$work/layout"
          rc=0
          kube-noob build audit -f "$work/Containerfile" --image-layout "$work/layout" --format json > "$work/report.json" || rc=$?
          test "$rc" = 1
          python -c "
          import json, sys
          text = open(sys.argv[1]).read()
          rep = json.loads(text)
          assert 'b3BlbnNzaC1rZXkt' not in text, 'the key body leaked into the report'
          hits = [f for f in rep['findings'] if f['ruleId'] == 'KN-B009']
          planted = [f for f in hits if 'root/.ssh/id_rsa' in f['message']]
          assert planted and 'deleted in layer' in planted[0]['message'], hits
          others = [f['message'] for f in hits if f not in planted]
          print('::notice title=image audit::planted key found in layer', planted[0]['layer'], 'of', rep['image']['layers'],
                '(deleted later);', len(others), 'other layer findings;', rep['image']['files'], 'files read;',
                'not read:', rep['image']['notRead'])
          for m in others[:10]:
              print('::warning title=image audit other finding::' + m[:300])
          " "$work/report.json"
      - name: Chart guards (fail-closed NetworkPolicy, fsGroup only off-OpenShift, web flag wired to env)
        run: |
          set -euo pipefail
          trap 'echo "::error title=chart guard failed::line $LINENO: $BASH_COMMAND"' ERR
          base="--set auth.existingSecret=kn-token"
          if helm template kn deploy/helm/kube-noob $base --set networkPolicy.allowSameNamespace=false \
               --set networkPolicy.allowRouter=false >/dev/null 2>&1; then
            echo "::error title=chart::NetworkPolicy with no allowed source must fail to render"; exit 1
          fi
          if helm template kn deploy/helm/kube-noob $base --set persistence.enabled=true >/dev/null 2>&1; then
            echo "::error title=chart::a ReadWriteOnce PVC with two replicas must fail to render"; exit 1
          fi
          pv="--set persistence.enabled=true --set replicaCount=1"
          helm template kn deploy/helm/kube-noob $base $pv | grep -q "fsGroup: 1001"
          helm template kn deploy/helm/kube-noob $base $pv | grep -q "type: Recreate"
          helm template kn deploy/helm/kube-noob $base $pv | kube-noob audit -f - --platform kubernetes --fail-on high
          if helm template kn deploy/helm/kube-noob $base $pv \
               --api-versions security.openshift.io/v1 | grep -q "fsGroup"; then
            echo "::error title=chart::fsGroup must not be set on OpenShift"; exit 1
          fi
          # Monitoring (N11): both objects need the Prometheus Operator CRDs, so both are off by default and a
          # default render must contain neither; a PrometheusRule without a ServiceMonitor must refuse, because an
          # alert on a metric nobody scrapes never fires and looks exactly like a healthy cluster.
          mon="--set monitoring.serviceMonitor.enabled=true"
          if helm template kn deploy/helm/kube-noob $base | grep -q "kind: ServiceMonitor"; then
            echo "::error title=chart::ServiceMonitor must be off by default"; exit 1
          fi
          if helm template kn deploy/helm/kube-noob $base | grep -q "kind: PrometheusRule"; then
            echo "::error title=chart::PrometheusRule must be off by default"; exit 1
          fi
          if helm template kn deploy/helm/kube-noob $base --set monitoring.prometheusRule.enabled=true \
               >/dev/null 2>&1; then
            echo "::error title=chart::a PrometheusRule without a ServiceMonitor must fail to render"; exit 1
          fi
          helm template kn deploy/helm/kube-noob $base $mon | grep -q "path: /metrics"
          helm template kn deploy/helm/kube-noob $base $mon | grep -q "name: \"kn-token\""
          helm template kn deploy/helm/kube-noob $base $mon --set monitoring.prometheusRule.enabled=true \
            | grep -q "alert: KubeNoobToolErrorRatio"
          # The scrape must carry the bearer token unless the operator opened /metrics deliberately.
          if helm template kn deploy/helm/kube-noob $base $mon \
               --set monitoring.allowUnauthenticatedMetrics=true | grep -q "authorization:"; then
            echo "::error title=chart::an opened /metrics must not still send credentials"; exit 1
          fi
          # The registry allowlist (KN-S036, R3c) has to reach BOTH config files -- the sidecar's and the
          # webhook's -- because `kube-noob audit` and the webhook must give one verdict, and an entry that can
          # never match an image, or enforcing the rule with no list at all, must fail at install rather than
          # look like a registry policy while allowing everything through.
          # An array, not a string: `"$reg"` made `--set audit.allowedRegistries={...}` ONE argument, so helm
          # answered `unknown flag: --set audit.allowedRegistries` and this guard could never pass. The brace list
          # has to stay one argument of its own, so it cannot be word-split like $base either.
          reg=(--set "audit.allowedRegistries={quay.io/my-org,registry.example.com:5000}")
          helm template kn deploy/helm/kube-noob $base "${reg[@]}" --show-only templates/configmap.yaml | python -c "
          import sys, yaml
          cfg = yaml.safe_load(yaml.safe_load(sys.stdin)['data']['config.yaml'])
          assert cfg['audit']['allowedRegistries'] == ['quay.io/my-org', 'registry.example.com:5000'], cfg
          "
          helm template kn deploy/helm/kube-noob $base "${reg[@]}" --set admission.enabled=true \
            --show-only templates/admission.yaml | python -c "
          import sys, yaml
          maps = [d for d in yaml.safe_load_all(sys.stdin) if d and d.get('kind') == 'ConfigMap']
          cfg = yaml.safe_load(maps[0]['data']['config.yaml'])
          assert cfg['audit']['allowedRegistries'] == ['quay.io/my-org', 'registry.example.com:5000'], cfg
          "
          if helm template kn deploy/helm/kube-noob $base --set "audit.allowedRegistries={MyRegistry}" \
               >/dev/null 2>&1; then
            echo "::error title=chart::an entry that is not a lower-case registry must fail to render"; exit 1
          fi
          if helm template kn deploy/helm/kube-noob $base --set admission.enabled=true \
               --set "admission.enforce={KN-S036}" >/dev/null 2>&1; then
            echo "::error title=chart::enforcing KN-S036 with no allowlist must fail to render"; exit 1
          fi
          helm template kn deploy/helm/kube-noob $base --set config.webEnabled=true \
            | grep -A1 "name: KUBE_NOOB_WEB_ENABLED" | grep -q '"true"'
          helm template kn deploy/helm/kube-noob $base --set config.offline=true \
            | grep -A1 "name: KUBE_NOOB_OFFLINE" | grep -q '"true"'
          helm template kn deploy/helm/kube-noob $base --set config.offline=null \
            | grep -A1 "name: KUBE_NOOB_OFFLINE" | grep -q '"false"'
          if helm template kn deploy/helm/kube-noob $base --set config.offline=true --set config.webEnabled=true \
               >/dev/null 2>&1; then
            echo "::error title=chart::offline + webEnabled must fail to render"; exit 1
          fi
          if helm template kn deploy/helm/kube-noob $base --set watch.enabled=true >/dev/null 2>&1; then
            echo "::error title=chart::watch.enabled without config.clusterEnabled must fail to render"; exit 1
          fi
          wt() { helm template kn deploy/helm/kube-noob -n shop $base --set watch.enabled=true \
            --set config.clusterEnabled=true --set "networkPolicy.egress.apiServerCIDRs={172.30.0.1/32}" "$@"; }
          if wt >/dev/null 2>&1; then
            echo "::error title=chart::watch.enabled with two replicas (two ledgers) must fail to render"; exit 1
          fi
          wt --set replicaCount=1 --set "rbac.namespaces={payments}" --show-only templates/configmap.yaml | python -c "
          import sys, yaml
          cfg = yaml.safe_load(yaml.safe_load(sys.stdin)['data']['config.yaml'])
          assert cfg['watch'] == {'enabled': True, 'intervalSeconds': 60, 'namespaces': ['shop', 'payments']}, cfg
          "
          wt --set replicaCount=1 | kube-noob audit -f - --platform openshift --version 4.22 --fail-on high
          if helm template kn deploy/helm/kube-noob $base --set posture.report.enabled=true >/dev/null 2>&1; then
            echo "::error title=chart::posture.report.enabled without config.clusterEnabled must fail to render"; exit 1
          fi
          if wt --set replicaCount=1 --set posture.report.enabled=true >/dev/null 2>&1; then
            echo "::error title=chart::posture.report.enabled without persistence must fail to render"; exit 1
          fi
          wt --set replicaCount=1 --set posture.report.enabled=true --set persistence.enabled=true \
            --set "rbac.namespaces={payments}" --show-only templates/configmap.yaml | python -c "
          import sys, yaml
          cfg = yaml.safe_load(yaml.safe_load(sys.stdin)['data']['config.yaml'])
          assert cfg['posture'] == {'reportEnabled': True, 'keep': 14, 'namespaces': ['shop', 'payments']}, cfg
          "
          if helm template kn deploy/helm/kube-noob $base --set rhacs.enabled=true >/dev/null 2>&1; then
            echo "::error title=chart::rhacs.enabled without rhacs.tokenSecret.name must fail to render"; exit 1
          fi
          if helm template kn deploy/helm/kube-noob $base --set rhacs.enabled=true --set rhacs.tokenSecret.name=rox \
               --set config.offline=true --set rhacs.endpoint=https://central.example.com >/dev/null 2>&1; then
            echo "::error title=chart::config.offline with an external RHACS Central must fail to render"; exit 1
          fi
          rh="--set rhacs.enabled=true --set rhacs.tokenSecret.name=rox --set rhacs.caConfigMap.name=rox-ca"
          helm template kn deploy/helm/kube-noob $base $rh --show-only templates/configmap.yaml | python -c "
          import sys, yaml
