name: release-ready

# kube-noob.com is built from the latest GitHub RELEASE. The site repository rebuilds every six hours and skips
# when nothing changed, so however often it runs, a week with no release is a week of the website stating the
# previous release's version, rule counts and install commands. G358 was that failure at its worst: the site could
# not build at all for six days and the alarm stayed green, because the published site and the latest release
# agreed while nothing moved.
#
# So the cadence itself needs a check. Once a week this says, in one issue, whether the repository is ready to cut
# a release and what to run -- or exactly what is stopping it. Four answers, never two:
#
#   ready       `## Unreleased` has bullets and every check on main is green. The issue carries the tag command.
#   not ready   something names itself: nothing unreleased, or a check on main that is not green.
#   not finished  nothing new to cut, but the latest release's own run did not succeed, so part of it never
#               left (G399). An empty changelog is not a release that got everywhere.
#   not known   a reading could not be taken. This is NOT ready: an unchecked release is not a safe one, and a
#               report that said ready because it could not look would be the defect this project exists to refuse.
on:
  schedule:
    # Mondays, after risk-review's 06:41 so the two do not contend, and well outside the 06:00-09:00 Pacific window.
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ledger:
    # The deliverables ledger of the latest release (G436): every asset, package, image, chart, registry entry
    # and website page it promised, each read where it is served. G399 asks whether the release RUN succeeded; a
    # run can succeed and the Videos page still have no card for a video, and a run can fail on one leg whose
    # deliverable was landed by hand afterwards. This asks the question itself. Its own job because it needs
    # Python and kube-noob's runtime dependencies (the lessons the website owes are asked of the code), and the
    # report below needs neither. It always exits 0 once the ledger is taken: the verdict is the report's to give.
    runs-on: ubuntu-latest
    # Not measured yet: this job is new. About eighty reads with a 20 s timeout and one retry each, and a host
    # that does not answer is asked once, so a run in which every host hung would take about five minutes.
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.ledger.outputs.tag }}
      rc: ${{ steps.ledger.outputs.rc }}
      rows: ${{ steps.ledger.outputs.rows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Runtime dependencies, from the hash-locked file
        run: |
          python -m pip install --disable-pip-version-check --quiet --require-hashes --only-binary=:all: \
            -r requirements.lock
      - name: Read every deliverable of the latest release where it is served
        id: ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName // ""') || tag=""
          if ! printf '%s' "${tag}" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error title=release-ready::the latest release could not be read as a tag like v1.2.3 (got '${tag}'), so there is no ledger to take."
            exit 1
          fi
          # The list is derived from the TAG's tree. main is ahead of it as soon as anything merges, and a lesson
          # merged after the release is not one that release's website owes. Without the tag the ledger says so in
          # its first row and is not known; it never falls back to main's list silently.
          auth=$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)
          echo "::add-mask::${auth}"
          if ! git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
              fetch --quiet --no-tags --depth 1 origin "+refs/tags/${tag}:refs/tags/${tag}"; then
            echo "::warning title=release-ready::${tag} could not be fetched; the ledger's first row will say the list was derived from main."
          fi
          rc=0
          python scripts/release_deliverables.py --version "${tag#v}" --format json > "${RUNNER_TEMP}/ledger.json" || rc=$?
          case "${rc}" in
            0|1|5) ;;
            *)
              echo "::error title=release-ready::the ledger for ${tag} could not be taken (exit ${rc}), so whether ${tag} is where it is served is NOT KNOWN."
              exit 1
              ;;
          esac
          rows=$(python scripts/release_deliverables.py --render "${RUNNER_TEMP}/ledger.json" --format markdown) || true
          if [ -z "${rows}" ]; then
            echo "::error title=release-ready::the ledger for ${tag} printed nothing, so whether ${tag} is where it is served is NOT KNOWN."
            exit 1
          fi
          printf '%s\n' "${rows}" >> "${GITHUB_STEP_SUMMARY}"
          end="ledger_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          {
            echo "tag=${tag}"
            echo "rc=${rc}"
            echo "rows<<${end}"
            printf '%s\n' "${rows}"
            echo "${end}"
          } >> "${GITHUB_OUTPUT}"
          echo "ledger for ${tag}: exit ${rc}"

  ready:
    # always(): a ledger job that failed must reach the report as NOT KNOWN. Skipped with it, the weekly issue
    # would simply keep last week's answer.
    needs: ledger
    if: always()
    runs-on: ubuntu-latest
    # Five API reads and a file parse; the last ten runs of comparable jobs finish inside a minute.
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Is there a release to cut, and would it be safe
        env:
          GH_TOKEN: ${{ github.token }}
          LEDGER_TAG: ${{ needs.ledger.outputs.tag }}
          LEDGER_RC: ${{ needs.ledger.outputs.rc }}
          LEDGER_ROWS: ${{ needs.ledger.outputs.rows }}
        run: |
          set -uo pipefail
          week=$(date -u +%G-W%V)
          title="Release ready ${week}"

          # The bullets under `## Unreleased`. bump_version renames that heading to the version and leaves it
          # empty, so an empty section means the last release took everything -- not that the file is unreadable.
          if [ ! -r CHANGELOG.md ]; then
            echo "::error title=release-ready::CHANGELOG.md could not be read, so whether there is anything to release is NOT KNOWN. This is not 'nothing to release'."
            exit 1
          fi
          # An empty section and a missing heading both count 0 bullets, and only the first is "nothing to cut".
          # `## [Unreleased]`, CRLF line endings or a renamed heading closed the issue as in step (G403).
          if ! grep -qx '## Unreleased' CHANGELOG.md; then
            echo "::error title=release-ready::CHANGELOG.md has no line that is exactly '## Unreleased', so whether there is anything to release is NOT KNOWN. This is not 'nothing to release'."
            exit 1
          fi
          bullets=$(awk '/^## Unreleased$/{f=1;next} /^## /{f=0} f && /^- /{n++} END{print n+0}' CHANGELOG.md)

          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName // ""')
          if [ -z "${tag}" ]; then
            echo "::error title=release-ready::no release exists in ${GITHUB_REPOSITORY}, so nothing can be compared and kube-noob.com has nothing to build from."
            exit 1
          fi
          # Each reading below is checked for its SHAPE as well as its transport. This script runs without `-e`,
          # and a reading that came back empty or malformed used to flow on as an empty string: a failed
          # `release view` printed "published 0 day(s) ago", and a null date emptied the body the issue was then
          # edited to (G403).
          published=$(gh release view "${tag}" --repo "$GITHUB_REPOSITORY" --json publishedAt --jq '.publishedAt // ""') || published=""
          if [ -z "${published}" ] || ! published_s=$(date -u -d "${published}" +%s 2>/dev/null); then
            echo "::error title=release-ready::when ${tag} was published could not be read, so how long the website has stated it is NOT KNOWN."
            exit 1
          fi
          days=$(( ( $(date -u +%s) - published_s ) / 86400 ))
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha) || sha=""
          if ! printf '%s' "${sha}" | grep -Eqx '[0-9a-f]{40}'; then
            echo "::error title=release-ready::main's head commit could not be read, so which checks to read is NOT KNOWN."
            exit 1
          fi

          # Whether the latest release finished shipping. A tag publishes to PyPI, the image, the chart, the MCP
          # Registry, Homebrew and the videos, each its own job, and the release run concludes success only if every
          # one of them did. v0.10.0's concluded failure -- four video renders, the video attach and the Homebrew
          # push -- and this report would have closed its issue over it as "in step with v0.10.0", because it
          # compared the CHANGELOG with the tag and never asked whether the tag got everywhere. Measured on
          # 2026-11-25: 4 of the last 8 release runs concluded failure (v0.8.0, v0.9.0, v0.9.1, v0.10.0) and nothing
          # said so (G399). The run is found by the tag it ran on; a re-run whose latest attempt succeeded reads as
          # success, which is right -- the jobs endpoint reports the latest attempt.
          if ! gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?branch=${tag}&event=push&per_page=1" > /tmp/release-run.json; then
            echo "::error title=release-ready::the release run for ${tag} could not be read, so whether ${tag} finished shipping is NOT KNOWN."
            exit 1
          fi
          run_id=$(jq -r '.workflow_runs[0].id // ""' /tmp/release-run.json)
          run_state=$(jq -r '.workflow_runs[0] | if . == null then "" elif .status != "completed" then .status else (.conclusion // "") end' /tmp/release-run.json)
          if [ -z "${run_id}" ] || [ -z "${run_state}" ]; then
            echo "::error title=release-ready::no release run exists for ${tag}, so whether it reached PyPI, the image, the chart, the MCP Registry, Homebrew and the videos is NOT KNOWN. A tag with no run is not a release that shipped."
            exit 1
          fi
          case "${run_state}" in
            queued|in_progress|waiting|pending|requested)
              echo "::error title=release-ready::the release run for ${tag} is still ${run_state}, so whether it finishes shipping is NOT KNOWN yet. Run this again when it completes."
              exit 1
              ;;
          esac
          unshipped=""
          if [ "${run_state}" != "success" ]; then
            if ! gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" --paginate \
                --jq '.jobs[] | select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral") | "\(.conclusion // .status) \(.name)"' > /tmp/release-jobs.txt; then
              echo "::error title=release-ready::the jobs of ${tag}'s release run could not be read; it concluded ${run_state}, so what it did not ship is NOT KNOWN."
              exit 1
            fi
            unshipped=$(paste -sd ',' /tmp/release-jobs.txt | sed 's/,/, /g')
            if [ -z "${unshipped}" ]; then
              unshipped="no job names itself; the run concluded ${run_state}"
            fi
          fi

          # Whether the latest release is WHERE IT IS SERVED (G436). The run concluding success says every job ran;
          # it does not say the Videos page has a card for each video, that the main nav links the mechanisms
          # page, or that the formula on main is this version's -- v0.11.0 and v0.11.1 each had one of those
          # wrong under a release nobody had flagged. The `ledger` job read each deliverable; its exit code is 0
          # (every row delivered), 1 (a row MISSING) or 5 (a row not known). A ledger that was not taken, or was
          # taken for another tag, is a reading that was not taken.
          if [ "${LEDGER_TAG:-}" != "${tag}" ] || ! printf '%s' "${LEDGER_RC:-}" | grep -Eqx '[015]' || [ -z "${LEDGER_ROWS:-}" ]; then
            echo "::error title=release-ready::the deliverables ledger for ${tag} was not taken (the ledger job answered for '${LEDGER_TAG:-nothing}' with exit '${LEDGER_RC:-none}'), so whether ${tag} is where it is served is NOT KNOWN."
            exit 1
          fi
          undelivered=""
          if [ "${LEDGER_RC}" != "0" ]; then
            undelivered=$(printf '%s\n' "${LEDGER_ROWS}" | grep -F -- '- [ ] ' | sed 's/^/    /' || true)
            if [ -z "${undelivered}" ]; then
              undelivered="    no row names itself; the ledger exited ${LEDGER_RC}"
            fi
          fi

          # Every check on main, not only the eight required ones. gate-ci, db-image and e2e-kind are not required,
          # and gate-ci is the only job that runs the gate as the real Action, a Tekton Task in kind and the GitLab
          # template -- a release cut while it is red is exactly the kind nobody should cut.
          if ! gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs" --paginate > /tmp/checks.json; then
            echo "::error title=release-ready::the checks on main could not be read, so whether a release would be safe is NOT KNOWN."
            exit 1
          fi
          # This workflow is ITSELF a check run on main's head while it is running. A scheduled run creates one --
          # measured: scorecard's scheduled run 45411849676 appears as the `analysis` check run on the commit it
          # ran against, alongside the push run's. Its own conclusion is null and its status is `in_progress`, so
          # the filter below would select it and this report could never say ready: every Monday it would name
          # its own job as the thing blocking the release. Excluded by RUN ID, not by name -- a name match would
          # also hide a real failure of another job that shares the name, and would break the moment this
          # workflow is renamed.
          mine="/actions/runs/${GITHUB_RUN_ID}/"
          # `--paginate` writes one JSON document per page, so every page is slurped and each must carry a
          # `check_runs` array. An answer of `{}`, `[]`, `{"message": "Not Found"}` or nothing made jq fail, left
          # `total` and `notgreen` empty, and an empty `notgreen` is the Ready branch: "all  checks on main are
          # green" over a reading that was never taken (G403).
          if ! jq -se 'length > 0 and all(.[]; (.check_runs | type) == "array")' /tmp/checks.json > /dev/null 2>&1; then
            echo "::error title=release-ready::the checks on main came back in a shape that is not a list of check runs, so whether a release would be safe is NOT KNOWN."
            exit 1
          fi
          others=$(jq -s --arg mine "${mine}" '[.[].check_runs[] | select(((.details_url // "") | contains($mine)) | not)]' /tmp/checks.json)
          total=$(printf '%s' "${others}" | jq -r 'length')
          if [ "${total}" = "0" ]; then
            echo "::error title=release-ready::main has no check runs other than this workflow's own, which is not a green main -- it is an unanswered question."
            exit 1
          fi
          # Checks that were all skipped are not a green main either: nothing that ran said success (G403).
          ran=$(printf '%s' "${others}" | jq -r '[.[] | select(.conclusion == "success")] | length')
          if [ "${ran}" = "0" ]; then
            echo "::error title=release-ready::no check on main concluded success -- every one was skipped or unfinished -- which is not a green main; it is an unanswered question."
            exit 1
          fi
          notgreen=$(printf '%s' "${others}" | jq -r '[.[] | select((.conclusion // .status) != "success" and .conclusion != "skipped") | "\(.conclusion // .status) \(.name)"] | join(", ")')

          if ! existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label release-ready --state open --limit 1 --json number,title --jq '.[0].number // ""'); then
            echo "::error title=release-ready::the open release-ready issue could not be looked up, so writing one now could duplicate it. NOT KNOWN which issue to update."
            exit 1
          fi

          unfinished=""
          if [ -n "${unshipped}" ]; then
            unfinished=$(printf '%s\n' \
              "" \
              "**\`${tag}\` did not finish shipping.** Its release run (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}) concluded \`${run_state}\`, and these jobs did not succeed:" \
              "" \
              "    ${unshipped}" \
              "" \
              "What those jobs publish did not leave that run, and every job that needed them was skipped. Re-run the failed jobs once their cause is fixed, or land each one another way and say so here. This stays open until the release run reads success or a newer release replaces ${tag}.")
          fi

          # A row that is MISSING or not known makes the answer "not finished", exactly as an unshipped job does,
          # and each row names itself with what was seen. Not known counts: a deliverable nobody could read is
          # not a delivered one.
          if [ -n "${undelivered}" ]; then
            unfinished=$(printf '%s\n' \
              "${unfinished}" \
              "" \
              "**\`${tag}\` is not everywhere it is served.** Its deliverables ledger (\`python scripts/release_deliverables.py --version ${tag#v}\`) exited ${LEDGER_RC}; these rows are MISSING or not known:" \
              "" \
              "${undelivered}" \
              "" \
              "MISSING was read and is not there; not known could not be read, which is not delivered either. A release is shipped when that command exits 0 (MAINTENANCE.md). This stays open until it does or a newer release replaces ${tag}.")
          fi
          ledger=$(printf '%s\n' \
            "" \
            "<details><summary>The deliverables ledger of ${tag}: every row, and what was seen</summary>" \
            "" \
            "${LEDGER_ROWS}" \
            "" \
            "</details>")

          if [ "${bullets}" = "0" ] && [ -z "${unfinished}" ]; then
            echo "nothing under ## Unreleased; ${tag} took everything (${days} days ago), its release run concluded success and every row of its ledger is delivered"
            if [ -n "${existing}" ]; then
              gh issue close "${existing}" --repo "$GITHUB_REPOSITORY" --comment "Closed by release-ready: \`## Unreleased\` is empty, so nothing is waiting to be released after ${tag}, ${tag}'s release run concluded success, and every deliverable in its ledger was read where it is served -- PyPI, the release assets, the formula, the image, the chart, the MCP Registry and kube-noob.com (G436)."
            fi
            exit 0
          fi

          if [ "${bullets}" = "0" ]; then
            body=$(printf '%s\n' \
              "**Not finished.** \`## Unreleased\` is empty, so there is nothing new to cut -- but an empty changelog is not a release that got everywhere." \
              "${unfinished}" \
              "${ledger}")
          elif [ -n "${notgreen}" ]; then
            body=$(printf '%s\n' \
              "**Not ready.** \`## Unreleased\` has **${bullets}** bullet(s), and the latest release is \`${tag}\`, published **${days}** day(s) ago — so kube-noob.com has been stating ${tag}'s version, rule counts and install commands for that long." \
              "" \
              "These checks on \`main\` (\`${sha}\`) are not green:" \
              "" \
              "    ${notgreen}" \
              "" \
              "Every check counts here, not only the eight required ones: \`gate-ci\` is the only job that runs the gate as the real Action, as a Tekton Task in kind and as the GitLab template, and it is not required, so a merge queue can be green while it is red." \
              "" \
              "Fix those, then re-run this workflow for the tag command." \
              "${unfinished}" \
              "${ledger}")
          else
            body=$(printf '%s\n' \
              "**Ready.** \`## Unreleased\` has **${bullets}** bullet(s), the latest release is \`${tag}\` from **${days}** day(s) ago, and all **${total}** checks on \`main\` (\`${sha}\`) are green." \
              "" \
              "Cut it:" \
              "" \
              "    python scripts/bump_version.py <next> \"<one-line reason>\"" \
              "" \
              "then open a pull request, let CI finish, confirm every check green again, merge, and tag:" \
              "" \
              "    gh api -X POST repos/${GITHUB_REPOSITORY}/git/refs -f ref=refs/tags/v<next> -f sha=<the merge commit>" \
              "" \
              "The tag publishes to PyPI, the image, the chart, the MCP Registry and Homebrew, and tells kube-noob.com within about twelve minutes (G356). The videos render afterwards and the site is asked again when they land." \
              "${unfinished}" \
              "${ledger}")
          fi

          if [ -n "${existing}" ]; then
            gh issue edit "${existing}" --repo "$GITHUB_REPOSITORY" --title "${title}" --body "${body}"
            echo "updated issue #${existing}"
          else
            # `gh issue create --label` refuses a label the repository does not have, and this one had never been
            # created: the first run of this workflow, on 2026-11-26, read every reading, wrote its answer, and
            # exited 1 on "could not add label: 'release-ready' not found" with no issue opened (G413). Created
            # here, as risk-review does for its own, and only on this branch -- after every reading is in.
            gh label create release-ready --repo "$GITHUB_REPOSITORY" --color 0e8a16 \
              --description "Weekly: is there something to release, and is main safe to release" --force >/dev/null
            gh issue create --repo "$GITHUB_REPOSITORY" --title "${title}" --label release-ready --body "${body}"
          fi
