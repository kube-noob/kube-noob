name: release-ready

# kube-noob.com is built from the latest GitHub RELEASE. The site repository rebuilds every six hours and skips
# when nothing changed, so however often it runs, a week with no release is a week of the website stating the
# previous release's version, rule counts and install commands. G358 was that failure at its worst: the site could
# not build at all for six days and the alarm stayed green, because the published site and the latest release
# agreed while nothing moved.
#
# So the cadence itself needs a check. Once a week this says, in one issue, whether the repository is ready to cut
# a release and what to run -- or exactly what is stopping it. Four answers, never two:
#
#   ready       `## Unreleased` has bullets and every check on main is green. The issue carries the tag command.
#   not ready   something names itself: nothing unreleased, or a check on main that is not green.
#   not finished  nothing new to cut, but the latest release's own run did not succeed, so part of it never
#               left (G399). An empty changelog is not a release that got everywhere.
#   not known   a reading could not be taken. This is NOT ready: an unchecked release is not a safe one, and a
#               report that said ready because it could not look would be the defect this project exists to refuse.
on:
  schedule:
    # Mondays, after risk-review's 06:41 so the two do not contend, and well outside the 06:00-09:00 Pacific window.
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ready:
    runs-on: ubuntu-latest
    # Five API reads and a file parse; the last ten runs of comparable jobs finish inside a minute.
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Is there a release to cut, and would it be safe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          week=$(date -u +%G-W%V)
          title="Release ready ${week}"

          # The bullets under `## Unreleased`. bump_version renames that heading to the version and leaves it
          # empty, so an empty section means the last release took everything -- not that the file is unreadable.
          if [ ! -r CHANGELOG.md ]; then
            echo "::error title=release-ready::CHANGELOG.md could not be read, so whether there is anything to release is NOT KNOWN. This is not 'nothing to release'."
            exit 1
          fi
          bullets=$(awk '/^## Unreleased$/{f=1;next} /^## /{f=0} f && /^- /{n++} END{print n+0}' CHANGELOG.md)

          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName // ""')
          if [ -z "${tag}" ]; then
            echo "::error title=release-ready::no release exists in ${GITHUB_REPOSITORY}, so nothing can be compared and kube-noob.com has nothing to build from."
            exit 1
          fi
          published=$(gh release view "${tag}" --repo "$GITHUB_REPOSITORY" --json publishedAt --jq .publishedAt)
          days=$(( ( $(date -u +%s) - $(date -u -d "${published}" +%s) ) / 86400 ))
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)

          # Whether the latest release finished shipping. A tag publishes to PyPI, the image, the chart, the MCP
          # Registry, Homebrew and the videos, each its own job, and the release run concludes success only if every
          # one of them did. v0.10.0's concluded failure -- four video renders, the video attach and the Homebrew
          # push -- and this report would have closed its issue over it as "in step with v0.10.0", because it
          # compared the CHANGELOG with the tag and never asked whether the tag got everywhere. Measured on
          # 2026-11-25: 4 of the last 8 release runs concluded failure (v0.8.0, v0.9.0, v0.9.1, v0.10.0) and nothing
          # said so (G399). The run is found by the tag it ran on; a re-run whose latest attempt succeeded reads as
          # success, which is right -- the jobs endpoint reports the latest attempt.
          if ! gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?branch=${tag}&event=push&per_page=1" > /tmp/release-run.json; then
            echo "::error title=release-ready::the release run for ${tag} could not be read, so whether ${tag} finished shipping is NOT KNOWN."
            exit 1
          fi
          run_id=$(jq -r '.workflow_runs[0].id // ""' /tmp/release-run.json)
          run_state=$(jq -r '.workflow_runs[0] | if . == null then "" elif .status != "completed" then .status else (.conclusion // "") end' /tmp/release-run.json)
          if [ -z "${run_id}" ] || [ -z "${run_state}" ]; then
            echo "::error title=release-ready::no release run exists for ${tag}, so whether it reached PyPI, the image, the chart, the MCP Registry, Homebrew and the videos is NOT KNOWN. A tag with no run is not a release that shipped."
            exit 1
          fi
          case "${run_state}" in
            queued|in_progress|waiting|pending|requested)
              echo "::error title=release-ready::the release run for ${tag} is still ${run_state}, so whether it finishes shipping is NOT KNOWN yet. Run this again when it completes."
              exit 1
              ;;
          esac
          unshipped=""
          if [ "${run_state}" != "success" ]; then
            if ! gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" --paginate \
                --jq '.jobs[] | select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral") | "\(.conclusion // .status) \(.name)"' > /tmp/release-jobs.txt; then
              echo "::error title=release-ready::the jobs of ${tag}'s release run could not be read; it concluded ${run_state}, so what it did not ship is NOT KNOWN."
              exit 1
            fi
            unshipped=$(paste -sd ',' /tmp/release-jobs.txt | sed 's/,/, /g')
            if [ -z "${unshipped}" ]; then
              unshipped="no job names itself; the run concluded ${run_state}"
            fi
          fi

          # Every check on main, not only the eight required ones. gate-ci, db-image and e2e-kind are not required,
          # and gate-ci is the only job that runs the gate as the real Action, a Tekton Task in kind and the GitLab
          # template -- a release cut while it is red is exactly the kind nobody should cut.
          if ! gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs" --paginate > /tmp/checks.json; then
            echo "::error title=release-ready::the checks on main could not be read, so whether a release would be safe is NOT KNOWN."
            exit 1
          fi
          # This workflow is ITSELF a check run on main's head while it is running. A scheduled run creates one --
          # measured: scorecard's scheduled run 45411849676 appears as the `analysis` check run on the commit it
          # ran against, alongside the push run's. Its own conclusion is null and its status is `in_progress`, so
          # the filter below would select it and this report could never say ready: every Monday it would name
          # its own job as the thing blocking the release. Excluded by RUN ID, not by name -- a name match would
          # also hide a real failure of another job that shares the name, and would break the moment this
          # workflow is renamed.
          mine="/actions/runs/${GITHUB_RUN_ID}/"
          others=$(jq --arg mine "${mine}" '[.check_runs[] | select(((.details_url // "") | contains($mine)) | not)]' /tmp/checks.json)
          total=$(printf '%s' "${others}" | jq -r 'length')
          if [ "${total}" = "0" ]; then
            echo "::error title=release-ready::main has no check runs other than this workflow's own, which is not a green main -- it is an unanswered question."
            exit 1
          fi
          notgreen=$(printf '%s' "${others}" | jq -r '[.[] | select((.conclusion // .status) != "success" and .conclusion != "skipped") | "\(.conclusion // .status) \(.name)"] | join(", ")')

          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label release-ready --state open --limit 1 --json number,title --jq '.[0].number // ""')

          unfinished=""
          if [ -n "${unshipped}" ]; then
            unfinished=$(printf '%s\n' \
              "" \
              "**\`${tag}\` did not finish shipping.** Its release run (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}) concluded \`${run_state}\`, and these jobs did not succeed:" \
              "" \
              "    ${unshipped}" \
              "" \
              "What those jobs publish did not leave that run, and every job that needed them was skipped. Re-run the failed jobs once their cause is fixed, or land each one another way and say so here. This stays open until the release run reads success or a newer release replaces ${tag}.")
          fi

          if [ "${bullets}" = "0" ] && [ -z "${unfinished}" ]; then
            echo "nothing under ## Unreleased; ${tag} took everything (${days} days ago) and its release run concluded success"
            if [ -n "${existing}" ]; then
              gh issue close "${existing}" --repo "$GITHUB_REPOSITORY" --comment "Closed by release-ready: \`## Unreleased\` is empty, so there is nothing to cut, and ${tag}'s release run concluded success. The website is in step with ${tag}."
            fi
            exit 0
          fi

          if [ "${bullets}" = "0" ]; then
            body=$(printf '%s\n' \
              "**Not finished.** \`## Unreleased\` is empty, so there is nothing new to cut -- but an empty changelog is not a release that got everywhere." \
              "${unfinished}")
          elif [ -n "${notgreen}" ]; then
            body=$(printf '%s\n' \
              "**Not ready.** \`## Unreleased\` has **${bullets}** bullet(s), and the latest release is \`${tag}\`, published **${days}** day(s) ago — so kube-noob.com has been stating ${tag}'s version, rule counts and install commands for that long." \
              "" \
              "These checks on \`main\` (\`${sha}\`) are not green:" \
              "" \
              "    ${notgreen}" \
              "" \
              "Every check counts here, not only the eight required ones: \`gate-ci\` is the only job that runs the gate as the real Action, as a Tekton Task in kind and as the GitLab template, and it is not required, so a merge queue can be green while it is red." \
              "" \
              "Fix those, then re-run this workflow for the tag command." \
              "${unfinished}")
          else
            body=$(printf '%s\n' \
              "**Ready.** \`## Unreleased\` has **${bullets}** bullet(s), the latest release is \`${tag}\` from **${days}** day(s) ago, and all **${total}** checks on \`main\` (\`${sha}\`) are green." \
              "" \
              "Cut it:" \
              "" \
              "    python scripts/bump_version.py <next> \"<one-line reason>\"" \
              "" \
              "then open a pull request, let CI finish, confirm every check green again, merge, and tag:" \
              "" \
              "    gh api -X POST repos/${GITHUB_REPOSITORY}/git/refs -f ref=refs/tags/v<next> -f sha=<the merge commit>" \
              "" \
              "The tag publishes to PyPI, the image, the chart, the MCP Registry and Homebrew, and tells kube-noob.com within about twelve minutes (G356). The videos render afterwards and the site is asked again when they land." \
              "${unfinished}")
          fi

          if [ -n "${existing}" ]; then
            gh issue edit "${existing}" --repo "$GITHUB_REPOSITORY" --title "${title}" --body "${body}"
            echo "updated issue #${existing}"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "${title}" --label release-ready --body "${body}"
          fi
