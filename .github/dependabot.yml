version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
    versioning-strategy: increase-if-necessary   # ranges already admit new releases; requirements.lock pins them
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /plugin/kube-noob
    schedule: {interval: weekly}
    groups:
      plugin:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # v4.39.4 failed the two-language upload in codeql.yml intermittently (2 of 5 runs, against 25 of 25 green on
      # v4.39.3); see the note there. Ignore this one release only, so the next one is still proposed and its pull
      # request shows whether analyze is green again. The workflow pins the SUB-actions `github/codeql-action/init`
      # and `/analyze`, and Dependabot matches `dependency-name` against those exact names: the bare
      # `github/codeql-action` matched neither, and #140 proposed 4.39.4 the day after this was written (G412). The
      # wildcard matches every sub-action of the repository.
      - dependency-name: "github/codeql-action*"
        versions: ["4.39.4"]
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
