version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
    versioning-strategy: increase-if-necessary   # ranges already admit new releases; requirements.lock pins them
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /plugin/kube-noob
    schedule: {interval: weekly}
    groups:
      plugin:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # v4.39.4 breaks the two-language upload in codeql.yml; see the note there. Ignore this one release only, so
      # the next one is still proposed and its pull request shows whether analyze is green again.
      - dependency-name: github/codeql-action
        versions: ["4.39.4"]
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
