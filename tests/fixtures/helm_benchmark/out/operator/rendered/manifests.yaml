---
# Source: operator/templates/rollout.yaml
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: bench-operator
  namespace: bench
spec:
  replicas: 2
  selector:
    matchLabels:
      app: operator
  template:
    metadata:
      labels:
        app: operator
    spec:
      containers:
        - name: operator
          image: quay.io/example/operator:1.0.0
---
# Source: operator/templates/kafka.yaml
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: bench-kafka
  namespace: bench
spec:
  kafka:
    replicas: 3
---
# Source: operator/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bench-operator
  namespace: bench
automountServiceAccountToken: false
