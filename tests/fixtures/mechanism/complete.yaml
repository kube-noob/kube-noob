# Every observable hop of `mech-net-request-to-pod` answerable from this bundle alone, and all of them holding:
# an Ingress at the edge on a class no rule retires, a Service that selects the workload's own pods on a port the
# containers declare, a workload whose selector matches its own template, a readiness probe, and a NetworkPolicy
# that is neither allow-all nor selects nothing. The walk reaches the end and every hop holds: exit 0.
#
# `broken.yaml` beside this file is the same bundle with the Ingress on `nginx`, which KN-V019 retires -- one hop
# BROKEN, the walk still reaching the end: exit 1. Drop one unreadable file into a directory with this one and the
# same bundle answers nothing at all: exit 5. That is the contrast the file exists for.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  namespace: shop
spec:
  ingressClassName: openshift-default
  tls:
    - hosts: ["shop.example.com"]
      secretName: shop-tls
  rules:
    - host: shop.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: orders-api
                port:
                  number: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api
  namespace: shop
spec:
  selector:
    app: orders-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: registry.example.com/orders-api@sha256:3333333333333333333333333333333333333333333333333333333333333333
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            limits: {cpu: "1", memory: 256Mi}
            requests: {cpu: 100m, memory: 128Mi}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orders-api-ingress
  namespace: shop
spec:
  podSelector:
    matchLabels:
      app: orders-api
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - protocol: TCP
          port: 8080
