      name: cis-tailored-api-server-encryption-provider-cipher
      namespace: openshift-compliance
      annotations:
        compliance.openshift.io/rule: ocp4-api-server-encryption-provider-cipher
      labels:
        compliance.openshift.io/scan-name: ocp4-cis
        compliance.openshift.io/suite: cis-suite
