apiVersion: v1
kind: Pod
metadata:
  name: kube-apiserver
  namespace: kube-system
spec:
  containers:
  - name: kube-apiserver
    image: registry.k8s.io/kube-apiserver:v1.19.0
    command:
    - kube-apiserver
    - --etcd-servers=https://e:2379
    - --authorization-mode=Node,RBAC
    - --insecure-port=8080
    - --insecure-bind-address= 0.0.0.0
