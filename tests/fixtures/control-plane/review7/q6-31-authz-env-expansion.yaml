apiVersion: v1
kind: Pod
metadata:
  name: kube-apiserver
  namespace: kube-system
spec:
  containers:
  - name: kube-apiserver
    image: registry.k8s.io/kube-apiserver:v1.30.0
    env:
    - name: MODE
      value: "AlwaysAllow"
    command:
    - kube-apiserver
    - --etcd-servers=https://e:2379
    - --authorization-mode=$(MODE)
