apiVersion: provisioning.cattle.io/v1
kind: Cluster
metadata:
  name: c
  namespace: fleet-default
spec:
  kubernetesVersion: v1.31.0+rke2r1
  rkeConfig:
    machineSelectorConfig:
    - config:
        kube-apiserver-arg:
        - authorization-mode=AlwaysAllow
    - machineLabelSelector:
        matchLabels: {x: y}
      config:
        kube-apiserver-arg:
        - anonymous-auth=true
