id: operators-two-documents-for-one-csv-are-a-conflict
class: 5
verdict: not-determined
summary: 'Two documents with the same namespace and name, one Succeeded 1.0.0 and one Failed 6.6.6: document order
  decided which one answered, with no note, so a shuffled bundle gave a different inventory and a Failed install
  could read as Succeeded.'
provenance: 'operators/inventory review before #55 (G270), defect 16'
inputs: operators-dup-disagree
cli:
  argv:
  - operators
  - inventory
  - -f
  - '{inputs}/all.yaml'
  - --require-complete
  - --format
  - json
expect:
  exit:
  - 5
  json:
    complete: false
  json_any:
    operators[*].notes[*]:
      contains: different objects of this name
forbid:
  what: listed, complete, one operator 1.0.0 Succeeded with no note, the Failed document gone
  exit:
  - 0
  json:
    complete: true
    operators[*].notes: []
