id: reach-two-workloads-of-one-name-are-an-ambiguity
class: 5
verdict: error-exit-2
summary: 'Two Deployment/shop/web documents, one benign and one with hostPID and a privileged container: `found[0]`
  picked the winner by sort order, the privileged document was never mentioned and the answer was `node none`, complete.'
provenance: posture/blast-radius review of 4d7b00d (G273), defect 4
expected_on: posture/blast-radius
probe:
  command:
  - posture
  - reach
inputs: reach-dup-anchor
cli:
  argv:
  - posture
  - reach
  - deployment/web
  - -n
  - shop
  - -f
  - '{inputs}/d.yaml'
  - --whole-bundle
  - --require-complete
  - --format
  - json
expect:
  exit:
  - 2
  stderr:
  - 2 different Deployment objects
forbid:
  what: node none, complete, exit 0, one of the two documents silently chosen
  exit:
  - 0
  json:
    complete: true
