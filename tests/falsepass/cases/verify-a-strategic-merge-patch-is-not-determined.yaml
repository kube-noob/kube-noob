id: verify-a-strategic-merge-patch-is-not-determined
class: 4
verdict: not-determined
summary: 'A strategic merge patch that turns hostNetwork on, against an object verify does not have: strategic merge
  joins lists by keys only the API server knows, so the result cannot be computed and must not be allowed.'
provenance: verify/pre-action review (G280)
expected_on: verify/pre-action
probe:
  command:
  - verify
inputs: verify-ok
cli:
  argv:
  - verify
  - --command
  - kubectl patch deployment web -p '{"spec":{"template":{"spec":{"hostNetwork":true}}}}'
  - --format
  - json
mcp:
  tool: verify_change
  args:
    command: kubectl patch deployment web -p '{"spec":{"template":{"spec":{"hostNetwork":true}}}}'
    files: {}
  expect:
    json:
      verdict: not-determined
  forbid:
    json:
      verdict: allow
expect:
  exit:
  - 5
  json:
    verdict: not-determined
  json_any:
    notDetermined[*]:
      contains: strategic
forbid:
  what: allow, exit 0, for a patch that puts a pod on the host network
  exit:
  - 0
  json:
    verdict: allow
