id: verify-kubeconfig-on-the-line-is-not-determined
class: 22
verdict: not-determined
summary: '`KUBECONFIG=/x` before the command picks the cluster the same way; an environment assignment is part of
  the command line and must be read as one.'
provenance: verify/pre-action review (G280)
expected_on: verify/pre-action
probe:
  command:
  - verify
inputs: verify-ok
cli:
  argv:
  - verify
  - --command
  - KUBECONFIG=/x kubectl apply -f {inputs}/ok.yaml
  - --format
  - json
mcp:
  tool: verify_change
  args:
    command: KUBECONFIG=/x kubectl apply -f ok.yaml
    files:
      ok.yaml: "apiVersion: v1\nkind: Pod\nmetadata: {name: ok, namespace: shop}\nspec:\n  containers: [{name: c,\
        \ image: nginx}]\n"
  expect:
    json:
      verdict: not-determined
  forbid:
    json:
      verdict: allow
expect:
  exit:
  - 5
  json:
    verdict: not-determined
  json_any:
    notDetermined[*]:
      contains: KUBECONFIG
forbid:
  what: allow, exit 0, with the assignment ignored
  exit:
  - 0
  json:
    verdict: allow
