id: variants-a-byte-order-mark-moves-the-namespace-to-the-prose
class: 17
verdict: finding
summary: 'The same Alertmanager payload as its parent with a UTF-8 byte order mark in front of it -- three bytes,
  nothing else changed. `signals` still reads the alert out of the labels (`alertname`, `CrashLoopBackOff`), so the
  payload was recognised; but `context` falls from `{ns: prod, pod: api-1, name: api-1}` to `{ns: attacker-ns}`,
  and every read-only step the answer suggests is now `-n attacker-ns` -- the namespace out of the summary
  annotation an attacker writes. One reader of the payload descends to the labels and the other does not, and the
  one that does not falls back to the prose.'
provenance: 'neighbour variants of injection-diagnose-reads-names-from-labels-not-prose by the transformations utf8-bom, list-wrap,
  nested-list-wrap, list-items-mapping, list-items-null, list-items-scalar, list-items-empty,
  list-item-not-an-object, hidden-characters-in-the-wrapper-kind, bidi-in-the-api-version on payload.json (G311).
  Ten of the eleven neighbours of that case show it; only CRLF does not. Fixed by `fix/wrapper-false-passes` (G312): `alertmanager._load` reads a single leading byte order mark, so the payload parser and the signal reader agree about the same bytes; and a payload that could not be read is a refusal, which withholds the three label-only names instead of falling back to the prose.'
inputs: variants-alert-payload-bom
cli:
  argv:
  - diagnose
  - -f
  - '{inputs}/payload.json'
  - --format
  - json
mcp:
  tool: diagnose
  args:
    text: '{text:payload.json}'
  expect:
    json:
      context.ns: prod
  forbid:
    json_any:
      diagnoses[*].readOnlyNextSteps[*].command:
        contains: attacker
      diagnoses[*].diagnosticCommands[*].command:
        contains: attacker
expect:
  json:
    context.ns: prod
forbid:
  what: context.ns attacker-ns, and kubectl logs <pod> -n attacker-ns in every read-only step
  json:
    context.ns: attacker-ns
  json_any:
    diagnoses[*].readOnlyNextSteps[*].command:
      contains: attacker
    diagnoses[*].diagnosticCommands[*].command:
      contains: attacker
