id: must-gather-analyze-says-okd-known-issues-are-not-determined
class: 6
verdict: not-determined
summary: '`must-gather analyze` on the same OKD bundle titled the cluster ''OpenShift 4.20.0-okd-...'' and matched
  its findings against OpenShift''s release notes; the sibling command must decide OKD as `operators issues` does
  and report the lookup as not determined, with the reason.'
provenance: operators/known-issues reviews one and two (R5, G278), second review
expected_on: operators/known-issues
probe:
  command:
  - operators
  - issues
inputs: issues-mg-okd
cli:
  argv:
  - must-gather
  - analyze
  - '{inputs}'
  - --format
  - json
expect:
  json:
    knownIssuesVerdict: not-determined
  json_any:
    knownIssuesNote:
      contains: OKD
forbid:
  what: knownIssuesVerdict looked-up, OpenShift issues matched for OKD
  json:
    knownIssuesVerdict: looked-up
