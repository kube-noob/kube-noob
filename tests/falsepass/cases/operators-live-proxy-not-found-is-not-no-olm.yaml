id: operators-live-proxy-not-found-is-not-no-olm
class: 3
verdict: not-determined
summary: 'The API server answers `Error from server (NotFound): the server could not find the requested resource`
  (a proxy or a wrong server, not a missing group): the same substring match turned it into `no-olm`, complete,
  exit 0.'
provenance: 'operators/inventory review before #55 (G270), defect 2'
inputs: operators-live
cli:
  argv:
  - operators
  - inventory
  - --live
  - --require-complete
  - --format
  - json
  kubectl: proxy404
expect:
  exit:
  - 5
  json:
    complete: false
    verdict: not-determined
forbid:
  what: no-olm, not an OLM cluster, complete, exit 0
  exit:
  - 0
  json:
    verdict: no-olm
    complete: true
