id: variants-a-clusterversion-that-could-not-be-read-is-not-not-okd
class: 4
verdict: not-determined
summary: 'The OKD must-gather of its parent, with the ClusterVersion document wrapped in a `List`: every field
  that carries the version goes honestly null -- `openshiftVersion`, `versionFrom`, `indexed` -- and the two
  booleans beside them do not. `cluster.okd: false` and `cluster.notOpenShift: false` assert that this cluster is
  not OKD and is OpenShift, from a document nothing could read, and `releasesSearched` lists three releases the
  lookup searched for a version it never had. A boolean has no third value, so the absence reads as the negative.'
provenance: 'neighbour variants of issues-an-okd-must-gather-is-not-openshift by the transformations nested-list-wrap,
  list-items-mapping, hidden-characters-in-the-wrapper-kind on
  cluster-scoped-resources/config.openshift.io/clusterversions/version.yaml (G311). The exit code is honest (5,
  `complete: false`); the booleans are not. Fixed by `fix/wrapper-false-passes` (G313): `Release.product_read` makes `cluster.okd` and `cluster.notOpenShift` three-valued, null while nothing read says what this cluster is.'
inputs: variants-mg-okd-wrapped-clusterversion
cli:
  argv:
  - operators
  - issues
  - --must-gather
  - '{inputs}'
  - --require-complete
  - --format
  - json
expect:
  exit:
  - 5
  json:
    complete: false
    cluster.okd: null
forbid:
  what: 'cluster.okd false and cluster.notOpenShift false for a ClusterVersion nothing could read'
  json:
    cluster.okd: false
    cluster.notOpenShift: false
