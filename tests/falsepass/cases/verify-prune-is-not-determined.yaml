id: verify-prune-is-not-determined
class: 22
verdict: not-determined
summary: 'A clean file with `--prune`: the flag deletes every object with the label that is not in the file, which
  verify cannot see; reading only the file would allow a deletion of unknown scope.'
provenance: verify/pre-action review (G280)
expected_on: verify/pre-action
probe:
  command:
  - verify
inputs: verify-ok
cli:
  argv:
  - verify
  - --command
  - kubectl apply -f {inputs}/ok.yaml --prune -l app=web
  - --format
  - json
mcp:
  tool: verify_change
  args:
    command: kubectl apply -f ok.yaml --prune -l app=web
    files:
      ok.yaml: "apiVersion: v1\nkind: Pod\nmetadata: {name: ok, namespace: shop}\nspec:\n  containers: [{name: c,\
        \ image: nginx}]\n"
  expect:
    json:
      verdict: not-determined
  forbid:
    json:
      verdict: allow
expect:
  exit:
  - 5
  json:
    verdict: not-determined
  json_any:
    notDetermined[*]:
      contains: --prune
forbid:
  what: allow, exit 0, on the clean file alone
  exit:
  - 0
  json:
    verdict: allow
