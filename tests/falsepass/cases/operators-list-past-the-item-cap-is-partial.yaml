id: operators-list-past-the-item-cap-is-partial
class: 2
verdict: not-determined
summary: 'A ClusterServiceVersionList of 50,050 items (2.85 MB, under the 5 MB file cap) beside an empty SubscriptionList:
  the slice to the 50,000-item cap happened before the dropped count was taken, so the answer was `listed`, complete,
  50,000 operators, no caveat; the 50 past the cap are a gap in the answer.'
provenance: 'operators/inventory review before #55 (G270), defect 7; the G282 review measured the shape reachable'
generate: csv-list-over-cap
cli:
  argv:
  - operators
  - inventory
  - -f
  - '{inputs}/csvs.json'
  - -f
  - '{inputs}/subs.json'
  - --require-complete
  - --format
  - json
expect:
  exit:
  - 5
  json:
    verdict: partial
    complete: false
  json_any:
    caveats[*]:
      contains: past the first 50000
forbid:
  what: 'listed, complete: true, 50,000 operators and no word about the 50 dropped'
  exit:
  - 0
  json:
    complete: true
