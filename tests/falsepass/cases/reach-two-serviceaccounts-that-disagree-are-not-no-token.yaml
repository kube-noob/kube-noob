id: reach-two-serviceaccounts-that-disagree-are-not-no-token
class: 5
verdict: not-determined
summary: 'Two ServiceAccount/shop/web documents, one with automountServiceAccountToken: false: whichever sorted
  first answered, so the token leg could say `none` for an account whose other document mounts the token, and the
  answer stayed complete.'
provenance: posture/blast-radius fourth review (G273), neighbours of item 9
expected_on: posture/blast-radius
probe:
  command:
  - posture
  - reach
inputs: reach-two-sas
cli:
  argv:
  - posture
  - reach
  - deployment/web
  - -n
  - shop
  - -f
  - '{inputs}/s.yaml'
  - --whole-bundle
  - --require-complete
  - --format
  - json
expect:
  exit:
  - 5
  json:
    complete: false
  json_any:
    legs[1].status: not determined
forbid:
  what: token none or reached, complete, exit 0, one document silently chosen
  exit:
  - 0
  json:
    complete: true
