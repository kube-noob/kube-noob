id: shape-a-document-whose-kind-is-a-list-is-named-not-audited
class: 4
verdict: not-evaluated
summary: 'A privileged, hostNetwork pod whose `kind` is `[Pod]`: no rule could read it, and the audit passed it
  clean beside the pod it could read, saying nothing about a document it had not audited; `fix` on the same file
  crashed with an unhashable list.'
provenance: plugin/directory-engine reviews one and two (G276)
expected_on: plugin/directory-engine
probe:
  json:
    argv:
    - redteam
    - -f
    - '{probes}/pod.yaml'
    - --platform
    - kubernetes
    - --version
    - '1.35'
    - --format
    - json
    path: assumptions
    value:
      exists: true
inputs: shape-kind-list
cli:
  argv:
  - audit
  - -f
  - '{inputs}/k.yaml'
  - --platform
  - kubernetes
  - --version
  - '1.35'
  - --format
  - json
expect:
  json_any:
    assumptions[*]:
      contains: kind or apiVersion that is not a string
forbid:
  what: the document with the unreadable kind absent from assumptions, the bundle clean
  stderr:
  - Traceback
