id: verify-a-heredoc-privileged-pod-is-denied
class: 22
verdict: deny
summary: 'A here-document on the command line carrying a hostPID, privileged pod: the manifest is in the command''s
  own text and must be read from it and denied, not skipped as `-f -` with no file.'
provenance: verify/pre-action review (G280)
expected_on: verify/pre-action
probe:
  command:
  - verify
cli:
  argv:
  - verify
  - --command
  - "kubectl apply -f - <<EOF\napiVersion: v1\nkind: Pod\nmetadata:\n  name: dbg\nspec:\n  hostPID: true\n  containers:\n\
    \  - name: dbg\n    image: busybox\n    securityContext:\n      privileged: true\nEOF"
  - --format
  - json
mcp:
  tool: verify_change
  args:
    command: "kubectl apply -f - <<EOF\napiVersion: v1\nkind: Pod\nmetadata:\n  name: dbg\nspec:\n  hostPID: true\n\
      \  containers:\n  - name: dbg\n    image: busybox\n    securityContext:\n      privileged: true\nEOF"
  expect:
    json:
      verdict: deny
  forbid:
    json:
      verdict: allow
expect:
  exit:
  - 1
  json:
    verdict: deny
  json_any:
    findings[*].ruleId: KN-S001
forbid:
  what: 'allow, exit 0: the here-document not read'
  exit:
  - 0
  json:
    verdict: allow
