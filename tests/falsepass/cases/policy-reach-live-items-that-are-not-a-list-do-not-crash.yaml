id: policy-reach-live-items-that-are-not-a-list-do-not-crash
class: 16
verdict: undetermined
summary: 'A NetworkPolicy list whose `items` is a mapping: the reader crashed with a traceback and exit 1 -- the
  exit code a gate reads as ''findings at --fail-on'' -- instead of answering `undetermined` for a list it could
  not read.'
provenance: fix/absent-vs-unread reviews one and two (G279)
expected_on: fix/absent-vs-unread
probe:
  grep:
    file: src/kube_noob/debug/cluster.py
    text: def classify_read_failure
inputs: policy-reach-live
cli:
  argv:
  - policy
  - reach
  - --from
  - monitoring/prometheus
  - --to
  - shop/orders
  - --port
  - '8080'
  - --live
  - --format
  - json
  kubectl: np-notlist
mcp:
  tool: cluster_check_traffic
  args:
    source: monitoring/prometheus
    destination: shop/orders
    port: 8080
  expect:
    json:
      verdict: undetermined
  forbid:
    json:
      verdict:
        in:
        - allowed
        - denied
expect:
  exit:
  - 1
  json:
    verdict: undetermined
forbid:
  what: a Python traceback on stderr, exit 1 read as findings
  stderr:
  - Traceback
  json:
    verdict: allowed
