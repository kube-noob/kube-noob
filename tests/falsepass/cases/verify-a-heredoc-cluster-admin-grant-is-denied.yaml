id: verify-a-heredoc-cluster-admin-grant-is-denied
class: 22
verdict: deny
summary: 'A quoted here-document (`<<''EOF''`) binding the default ServiceAccount to cluster-admin: a grant of cluster-admin
  denies through the memory verifier''s own list, whatever the quoting of the delimiter.'
provenance: verify/pre-action review (G280)
expected_on: verify/pre-action
probe:
  command:
  - verify
cli:
  argv:
  - verify
  - --command
  - "kubectl apply -f - <<'EOF'\napiVersion: rbac.authorization.k8s.io/v1\nkind: ClusterRoleBinding\nmetadata:\n\
    \  name: dev-admin\nroleRef:\n  apiGroup: rbac.authorization.k8s.io\n  kind: ClusterRole\n  name: cluster-admin\n\
    subjects:\n- kind: ServiceAccount\n  name: default\n  namespace: default\nEOF"
  - --format
  - json
mcp:
  tool: verify_change
  args:
    command: "kubectl apply -f - <<'EOF'\napiVersion: rbac.authorization.k8s.io/v1\nkind: ClusterRoleBinding\nmetadata:\n\
      \  name: dev-admin\nroleRef:\n  apiGroup: rbac.authorization.k8s.io\n  kind: ClusterRole\n  name: cluster-admin\n\
      subjects:\n- kind: ServiceAccount\n  name: default\n  namespace: default\nEOF"
  expect:
    json:
      verdict: deny
  forbid:
    json:
      verdict: allow
expect:
  exit:
  - 1
  json:
    verdict: deny
forbid:
  what: allow, exit 0
  exit:
  - 0
  json:
    verdict: allow
