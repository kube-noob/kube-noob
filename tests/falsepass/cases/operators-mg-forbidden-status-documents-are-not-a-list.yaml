id: operators-mg-forbidden-status-documents-are-not-a-list
class: 4
verdict: not-determined
summary: 'A must-gather in which `oc adm inspect` wrote the API server''s `kind: Status, code: 403` refusal where
  the ClusterServiceVersion and Subscription lists belong: the documents parsed, held no OLM object, and were counted
  as read, so the answer was `listed`, 0 operators, complete, exit 0.'
provenance: 'operators/inventory review before #55 (G270), defect 5'
inputs: operators-mg-status-403
cli:
  argv:
  - operators
  - inventory
  - --must-gather
  - '{inputs}/'
  - --require-complete
  - --format
  - json
expect:
  exit:
  - 5
  json:
    complete: false
  json_any:
    verdict:
      in:
      - partial
      - not-determined
forbid:
  what: listed, 0 operators, complete, exit 0
  exit:
  - 0
  json:
    complete: true
