id: verify-a-context-on-the-line-is-not-determined
class: 22
verdict: not-determined
summary: '`--context prod` picks the cluster or identity; verify does not know what that cluster holds, and an allow
  would carry the file''s verdict to a target it never saw.'
provenance: verify/pre-action review (G280)
expected_on: verify/pre-action
probe:
  command:
  - verify
inputs: verify-ok
cli:
  argv:
  - verify
  - --command
  - kubectl apply -f {inputs}/ok.yaml --context prod
  - --format
  - json
mcp:
  tool: verify_change
  args:
    command: kubectl apply -f ok.yaml --context prod
    files:
      ok.yaml: "apiVersion: v1\nkind: Pod\nmetadata: {name: ok, namespace: shop}\nspec:\n  containers: [{name: c,\
        \ image: nginx}]\n"
  expect:
    json:
      verdict: not-determined
  forbid:
    json:
      verdict: allow
expect:
  exit:
  - 5
  json:
    verdict: not-determined
  json_any:
    notDetermined[*]:
      contains: --context
forbid:
  what: allow, exit 0, with the context ignored
  exit:
  - 0
  json:
    verdict: allow
