id: reach-aggregate-to-view-source-reaches-secrets
class: 4
verdict: finding
summary: 'A ClusterRole labelled aggregate-to-view that grants secrets get/list/watch, and a RoleBinding to `view`
  (itself not in the input): the built-in stand-in for `view` ignored the aggregation source the bundle carried,
  so rbac and secrets were `none`, complete.'
provenance: posture/blast-radius review of 4d7b00d (G273), defect 8
expected_on: posture/blast-radius
probe:
  command:
  - posture
  - reach
inputs: reach-aggregate
cli:
  argv:
  - posture
  - reach
  - deployment/web
  - -n
  - shop
  - -f
  - '{inputs}/agg.yaml'
  - --whole-bundle
  - --require-complete
  - --format
  - json
expect:
  json_any:
    legs[*].status:
      in:
      - reached
      - not determined
forbid:
  what: rbac none, secrets none, complete, exit 0
  exit:
  - 0
  json:
    legs[3].status: none
    complete: true
