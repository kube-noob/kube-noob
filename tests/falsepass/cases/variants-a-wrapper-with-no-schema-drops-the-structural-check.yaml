id: variants-a-wrapper-with-no-schema-drops-the-structural-check
class: 1
verdict: finding
summary: 'The PodList of its parent -- first item the number 7, second an AlwaysAllow API server -- wrapped in one
  more `List`. On the parent, the bundled Kubernetes schema for `PodList` reports the non-object item as KN-V007
  (`7 is not of type object`) and the bundle scores 80. Nested one level deeper there is no bundled schema for the
  wrapper, so the structural check is skipped for everything inside it: KN-V007 is gone, and the score RISES to 90
  beside an assumption line that says structural checks were skipped. The caveat survived the extra wrapper and the
  finding and the number did not.'
provenance: 'neighbour variants of control-plane-a-list-with-an-item-that-is-not-an-object-declines:
  nested-list-wrap, typed-list-wrap, hidden-characters-in-the-wrapper-kind on d/list.yaml (G311). Open on main and
  no branch owns the fix, so it waits. The probe holds when the structural check reaches an item inside a wrapper
  kube-noob has no schema for.'
expected_on: main
probe:
  json:
    argv:
    - audit
    - -f
    - '{probes}/nested-list-odd-item.yaml'
    - --platform
    - kubernetes
    - --version
    - '1.35'
    - --format
    - json
    path: findings[*].ruleId
    value: KN-V007
inputs: variants-nested-list-odd-item
cli:
  argv:
  - audit
  - -f
  - '{inputs}/d'
  - --platform
  - kubernetes
  - --version
  - '1.35'
  - --format
  - json
expect:
  json_any:
    findings[*].ruleId: KN-V007
forbid:
  what: 'KN-V007 gone and the score up from 80 to 90, beside "structural checks skipped"'
  json:
    summary.score:
      gt: 80
