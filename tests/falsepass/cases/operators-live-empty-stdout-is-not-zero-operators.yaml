id: operators-live-empty-stdout-is-not-zero-operators
class: 16
verdict: not-determined
summary: 'kubectl exits 0 with an empty stdout for every read: an empty document became `{}` and `items` defaulted
  to nothing, so the answer was `listed -- 0 operators`, complete, exit 0.'
provenance: 'operators/inventory review before #55 (G270), defect 19'
inputs: operators-live
cli:
  argv:
  - operators
  - inventory
  - --live
  - --require-complete
  - --format
  - json
  kubectl: empty
expect:
  exit:
  - 5
  json:
    complete: false
forbid:
  what: listed, 0 operators, complete, exit 0
  exit:
  - 0
  json:
    complete: true
    verdict: listed
