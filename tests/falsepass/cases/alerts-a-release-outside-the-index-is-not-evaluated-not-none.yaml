id: alerts-a-release-outside-the-index-is-not-evaluated-not-none
class: 4
verdict: not-evaluated
summary: 'An alert labelled openshift_version 4.99.999, outside the releases the local issues cover: the known-issue
  section said `status: none`, ''No reported issue matched'', for a release in which nothing was looked for.'
provenance: alerts/evidence-report reviews one to three (I1, G274)
expected_on: alerts/evidence-report
probe:
  command:
  - alerts
  - report
inputs: alerts-version-outside-index
cli:
  argv:
  - alerts
  - report
  - -f
  - '{inputs}/payload.json'
  - --format
  - json
mcp:
  tool: alert_report
  args:
    payload: '{text:payload.json}'
  expect:
    json:
      report.alerts[0].knownIssues.status: not-evaluated
  forbid:
    json:
      report.alerts[0].knownIssues.status: none
expect:
  json:
    report.alerts[0].knownIssues.status: not-evaluated
forbid:
  what: knownIssues status none for a release the index does not hold
  json:
    report.alerts[0].knownIssues.status: none
