id: verify-a-cluster-admin-binding-by-flags-is-denied
class: 22
verdict: deny
summary: '`kubectl create clusterrolebinding x --clusterrole=cluster-admin --serviceaccount=default:default`: no
  file at all, the grant is in the flags; a check that reads only `-f` files would allow it.'
provenance: verify/pre-action review (G280)
expected_on: verify/pre-action
probe:
  command:
  - verify
cli:
  argv:
  - verify
  - --command
  - kubectl create clusterrolebinding x --clusterrole=cluster-admin --serviceaccount=default:default
  - --format
  - json
expect:
  exit:
  - 1
  json:
    verdict: deny
forbid:
  what: allow, exit 0
  exit:
  - 0
  json:
    verdict: allow
