id: operators-foreign-subscription-kind-does-not-count
class: 3
verdict: not-determined
summary: 'One OLM ClusterServiceVersion plus an Open Cluster Management `Subscription` (group `apps.open-cluster-management.io`):
  `kind` was matched without its group, so the foreign object made Subscriptions ''read'', the verdict `listed`,
  the CSV ''installed by hand'' and a bogus operator `my-app` appeared.'
provenance: 'operators/inventory review before #55 (G270), defect 6'
inputs: operators-foreign-subscription
cli:
  argv:
  - operators
  - inventory
  - -f
  - '{inputs}/all.yaml'
  - --require-complete
  - --format
  - json
mcp:
  tool: operator_inventory
  args:
    manifests: '{text:all.yaml}'
  expect:
    json:
      complete: false
  forbid:
    json:
      complete: true
    json_any:
      operators[*].package: my-app
expect:
  exit:
  - 5
  json:
    complete: false
  json_any:
    sources[*].resource: subscriptions
forbid:
  what: listed, complete, a Subscription read, and an operator my-app that OLM never installed
  exit:
  - 0
  json:
    complete: true
  json_any:
    operators[*].package: my-app
