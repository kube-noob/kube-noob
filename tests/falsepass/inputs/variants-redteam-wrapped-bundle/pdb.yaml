apiVersion: v1
items:
- apiVersion: v1
  items:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: web
      namespace: shop
    spec:
      replicas: 3
      selector:
        matchLabels:
          app: web
      template:
        metadata:
          labels:
            app: web
        spec:
          containers:
          - image: nginx
            name: web
  - apiVersion: policy/v1
    kind: PodDisruptionBudget
    metadata:
      name: web
      namespace: shop
    spec:
      minAvailable: 3
      selector:
        matchLabels:
          app: web
  - apiVersion: policy/v1
    kind: PodDisruptionBudget
    metadata:
      name: other
      namespace: shop
    spec:
      minAvailable: 1
      selector: 7
  kind: List
kind: List
