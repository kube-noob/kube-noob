# DISA Kubernetes STIG, Version 2 Release 6: the rule list kube-noob's crosswalk is written against.
# One entry per rule: `id` (the Group/Vuln id), `rule_id` (with its revision), `stig_id`, `severity` (high is
# CAT I, medium CAT II, low CAT III), DISA's `title`, and `check`, which is ONE LINE IN KUBE-NOOB'S OWN WORDS
# saying what the check reads and when it is a finding. DISA's check, fix and discussion text is not shipped.
#
# Provenance. The authoritative source is DISA's XCCDF, which NIST's National Checklist Program lists at
# `source.checklist`. Neither ncp.nist.gov nor public.cyber.mil could be read when this was written
# (2026-11-28), so the ids, rule ids, severities and titles were parsed from MITRE SAF's two InSpec profiles for
# this release, which carry DISA's metadata as tags, at the commits in `source.parsed_from`.
# `source.parsed_sha256` is the sha256 over those `controls/SV-*.rb` files (cluster then node, each sorted by
# name, each as `<profile>/controls/<name>\n` followed by the file's bytes). Every id, rule id and severity
# was then compared with the two mirrors in `source.cross_checked`, which agreed on all 92; `source.published`
# is the date both give. `source.rules_sha256` is the sha256 of the `rules` list as canonical JSON, which
# `scripts/stig_crosswalk.py --check` and `tests/test_stig_crosswalk.py` recompute.
#
# Do not edit by hand to add a rule: an id that is not DISA's is an invented control. A new release replaces
# the file, and `python scripts/stig_crosswalk.py --verify-source CLUSTER_DIR NODE_DIR` compares it with
# checkouts of the two profiles.
