# What kube-noob's rules judge of each rule in the DISA Kubernetes STIG (`kubernetes-stig.yaml`, beside this file).
# Hand-written, and every row is held by `tests/test_stig_crosswalk.py`. Each row has:
#   status: one of exactly four --
#     covered                          a kube-noob rule judges this check from manifests; `judged` says how
#     partly                           a rule judges part of it; `not_judged` names the part it does not
#     not determinable from manifests  the check reads something no manifest holds; `evidence` names it
#     not covered                      a manifest could decide it and no rule reads it; `backlog` names the rule
#   reads: what the check reads -- static-pod-manifest | kubelet | node-files | node-state | cluster-objects |
#          documentation
#   rules: the kube-noob rule ids, for covered and partly only. Nothing else may name a rule here: a rule id on
#          a row reads as coverage.
# A status is a claim about the rule, not about a cluster. `covered` never means compliant, and no status here
# is a pass. Change a row only with the fixture that measures it.
version: 1
