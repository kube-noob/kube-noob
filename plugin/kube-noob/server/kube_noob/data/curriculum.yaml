# kube-noob curriculum. Lessons reference built-in knowledge docs (src/kube_noob/data/knowledge/<id>.md).
# Exercises are graded offline with the deterministic check DSL (kube_noob/evals/checks.py).
# `reference` blueprints are rendered by the generator to produce reference solutions (used by tests and SFT export).
version: 1
tracks:
  - id: mechanisms
    title: How a cluster works, step by step
    summary: >-
      Ordered walks along one path each, graded against your own manifests. Every other track teaches what to
      write and what passes; these teach what happens, in order, and where it breaks. A step whose evidence is
      not in the input says it cannot be judged and the walk stops there, rather than drawing the rest of the
      arrow.
    lessons:
      - id: mech-cp-a-node-goes-dark
        title: A node goes dark
        layer: control-plane
        docs: [kubernetes]
        examples: [mechanism/complete, mechanism/broken]
        objectives:
          - Follow what has to be true, in order, for a workload to survive losing a node
          - See which of those your own manifests answer for, and which nothing here reads
        keyPoints:
          - Surviving a lost node is four separate questions, and three of them are in your manifests.
          - The fourth is the scheduler's, and no manifest records it, so kube-noob does not claim to check it.
        steps:
          - id: more-than-one-replica
            title: No replicated workload here is left at a single replica
            needs: [Deployment, StatefulSet, ReplicaSet]
            holds: every Deployment, StatefulSet and ReplicaSet here declares two or more replicas, or is scaled by
              an autoscaler whose own floor is two or more -- so losing one replica is not losing all of it
            rules: [KN-C007]
            # KN-C007 is excused by an autoscaler, and on a fragment the autoscaler may be in a file nobody
            # passed: the walk then lists the finding and does not call the hop BROKEN (G408).
            absent: [KN-C007]
          - id: replicas-can-land-apart
            title: A workload with replicas to spread asks for them spread
            needs: [Deployment, StatefulSet, ReplicaSet]
            holds: every workload here declaring two or more replicas also declares topologySpreadConstraints or
              podAntiAffinity; KN-C010 is silent about a workload below two replicas
            rules: [KN-C010]
          - id: the-budget-lets-one-go
            title: The disruption budget lets one of them go
            # Measured, not assumed: with no PodDisruptionBudget in the input KN-C009 ABSTAINS -- it lands in
            # `notEvaluated` as "no policy PodDisruptionBudget in the input" -- so nothing judges this hop and
            # the walk stops. That is the opposite of the network lesson's policy hop, where KN-N001 FIRES on
            # the absence and so judges it. Two rules about a missing object, two different answers; the first
            # version of this comment claimed the KN-N001 behaviour for KN-C009 from its title alone (G389).
            needs: []
            reads: [PodDisruptionBudget]
            holds: no budget here demands every replica stay up, so a drain can evict one
            rules: [KN-C009]
          - id: the-scheduler-places-the-replacement
            title: The scheduler finds somewhere to put the replacement
            observable: false
            holds: >-
              filter, score, bind: the remaining nodes have the room, the taints tolerate it and the affinity
              allows it. That decision belongs to a running scheduler and no manifest records it, so kube-noob
              does not check it and does not count it as passed.
      - id: mech-cp-deploy-an-app
        title: Deploy an app
        layer: control-plane
        docs: [kubernetes]
        examples: [mechanism/deploy/complete, mechanism/deploy/broken]
        objectives:
          - Follow a Deployment from the manifest you send to a pod that is ready for traffic
          - See which steps your manifests decide, and which belong to the API server, the controllers, the
            scheduler and the kubelet
        keyPoints:
          - Five of the nine steps are in the manifest; the four that are not are where a running cluster decides.
          - A step about what the pod names stops when the bundle defines no object of that kind at all, because
            an operator may create it -- that is not the same as the name being found.
        steps:
          - id: manifest-is-not-refused
            title: Nothing here is refused for its identity, its API version, its selector or a request above its limit
            # Measured (G422): each of these fires on its violation and is silent and evaluated on the healthy
            # Deployment -- KN-V001 (no metadata.name), KN-V002 (apps/v2), KN-V005 (apps/v1beta1), KN-V009
            # (Orders_API), KN-V010 (selector not matching the template, or absent), KN-C006 (request above the
            # limit). KN-V010 is here and not on a later hop: it is a validation finding about the Deployment, and
            # a hop that reads a Deployment does not hold beside one (G406). A Deployment with no pod template
            # leaves KN-C006 with "no pod spec in the input", and the hop stops.
            needs: [Deployment]
            holds: >-
              every object here states its apiVersion, kind and name, is sent to an API version that serves its
              kind and has not been removed, has a valid name, selects its own pod template and requests no more
              than its limit. These six rules are not the whole of the API server's validation, so a field none
              of them reads can still be refused
            rules: [KN-V001, KN-V002, KN-V005, KN-V009, KN-V010, KN-C006]
          - id: api-server-admits-and-stores-it
            title: The API server authenticates, authorizes, admits and stores the Deployment
            observable: false
            holds: >-
              the API server checks who is asking and whether they may create Deployments in this namespace,
              fills in defaults, runs admission, and writes the object to etcd. Who applies the manifest and what
              the cluster's admission chain refuses are not in it, so kube-noob does not check this and does not
              count it as passed.
          - id: controllers-create-the-pods
            title: The Deployment controller creates a ReplicaSet, and it creates the Pods
            observable: false
            holds: >-
              the Deployment controller writes a ReplicaSet and the ReplicaSet controller writes one Pod per
              replica, each with no node yet. That happens in the controller manager of a running cluster and no
              manifest records it, so kube-noob does not check it and does not count it as passed.
          - id: containers-declare-requests
            title: Every container declares the CPU and memory it asks the scheduler for
            # Measured (G422): fires with no requests and with no resources at all, on a fragment too (it reads
            # the pod spec in front of it); "no pod spec in the input" without a workload.
            needs: [Deployment]
            holds: >-
              every container here declares a CPU and a memory request, which is what the scheduler fits to a
              node. Whether any node has that much free is the next hop's question, and not this one's
            rules: [KN-C004]
          - id: scheduler-binds-the-pod
            title: The scheduler picks a node for each Pod
            observable: false
            holds: >-
              filter, score, bind: a node with room for the requests, whose taints the Pod tolerates and whose
              labels its affinity allows. That decision belongs to a running scheduler and no manifest records
              it, so kube-noob does not check it and does not count it as passed.
          - id: pod-names-objects-that-are-here
            title: Every ConfigMap, Secret, claim and ServiceAccount a pod names is in this namespace
            # Measured (G422): silent and evaluated when the pod names a ConfigMap that is here, or names
            # nothing; fires on a name that is missing BESIDE another object of that kind. When the bundle
            # defines no object of that kind at all it abstains ("may be an object created outside the bundle"),
            # and on a fragment it abstains too -- so the hop stops in both cases and is never BROKEN on a
            # fragment, without an `absent:` entry.
            needs: [Deployment]
            holds: >-
              every ConfigMap, Secret, PersistentVolumeClaim and ServiceAccount a pod spec names is defined in
              this namespace, so the kubelet will not hold the Pod in ContainerCreating waiting for one. KN-C017
              reads names against the objects in this input; one the cluster already holds is not read
            rules: [KN-C017]
          - id: image-is-named-by-digest
            title: Every container names its image by digest
            # Measured (G422): fires on `:latest`, on a version tag and on a container with no image; silent on
            # a digest. It does not read whether the registry can be reached or the pull is authorized.
            needs: [Deployment]
            holds: >-
              every container names its image by digest, so the node pulls the bytes that were reviewed and
              every replica runs the same ones. Whether the registry answers and the pull is authorized is the
              kubelet's to find out
            rules: [KN-S012]
          - id: kubelet-starts-the-container
            title: The kubelet starts the Pod on its node
            observable: false
            holds: >-
              the kubelet has the runtime create a sandbox, the network plugin gives it an address, the image
              is pulled and the container starts. None of that is in a manifest, so kube-noob does not check it
              and does not count it as passed.
          - id: containers-declare-readiness
            title: The containers declare a readiness probe
            needs: [Deployment]
            holds: >-
              the containers declare a readiness probe, so the Pod is marked Ready, and added to a Service's
              endpoints, only when it can serve. Whether the probe succeeds is runtime state no manifest holds
            rules: [KN-C001]
      - id: mech-cp-autoscaling
        title: Autoscaling
        layer: control-plane
        docs: [kubernetes]
        examples: [mechanism/autoscaling/complete, mechanism/autoscaling/broken]
        objectives:
          - Follow how a HorizontalPodAutoscaler turns measured usage into a replica count
          - See which of those steps your manifests decide, and which belong to the metrics pipeline, the
            controller and the scheduler
        keyPoints:
          - An autoscaler scales only a target in its own namespace, and a target that is not in the bundle is
            not judged either way -- something else may create it.
          - A CPU utilization target is usage divided by the request, so it needs the request.
          - Four of the seven steps are in the manifest; the three that are not are where a running cluster decides.
        steps:
          - id: autoscaler-names-a-target-that-is-here
            title: No autoscaler here has a floor above its ceiling or a target in another namespace
            # Measured (G435): first, because with the target absent KN-C012 and KN-C014 are silent and
            # EVALUATED -- they found no workload the autoscaler names and said nothing -- and only KN-V025
            # records that no verdict was reached ("may be created outside the bundle"; on a fragment, "part of a
            # namespace was passed"; a different API group, "names an API group other than"). So the walk stops
            # here instead of holding the next two hops on an autoscaler that scales nothing in this input. It
            # fires on minReplicas above maxReplicas, which is how this hop is BROKEN. It fires on a target that
            # is only in another namespace too, but a walk judges one namespace (G404): given two it names them
            # and stops here at exit 5, and that finding is `audit`'s to give. With no HorizontalPodAutoscaler
            # at all, `needs` stops the walk.
            needs: [HorizontalPodAutoscaler]
            reads: [HorizontalPodAutoscaler, Deployment, StatefulSet, ReplicaSet]
            holds: >-
              every HorizontalPodAutoscaler here has minReplicas at or below maxReplicas and names a Deployment,
              StatefulSet or ReplicaSet that is in its own namespace in this input. KN-V025 takes a reference
              with no apiVersion to mean the object of that kind and name, which a cluster may still refuse, and
              an autoscaler of an Argo Rollout or another kind is not resolved
            rules: [KN-V025]
          - id: metrics-are-served
            title: The metrics API serves what each pod is using
            observable: false
            holds: >-
              the kubelet measures each container, and metrics-server (or an adapter, for custom and external
              metrics) serves those numbers through the metrics API the autoscaler reads. Whether that pipeline
              is installed and answering is a fact about the cluster and no manifest here records it, so
              kube-noob does not check it and does not count it as passed.
          - id: target-declares-cpu-requests
            title: Every workload a CPU-utilization autoscaler scales declares CPU requests
            # Measured (G435): fires when a container of the target has no CPU request and the autoscaler's
            # metric is CPU Utilization; silent on a CPU AverageValue target, which needs no request. Silent on
            # a MEMORY utilization target with no memory request -- the rule reads CPU only -- and the sentence
            # says so.
            needs: [HorizontalPodAutoscaler]
            reads: [HorizontalPodAutoscaler, Deployment, StatefulSet, ReplicaSet]
            holds: >-
              every container of a workload scaled on CPU utilization declares a CPU request, which is what the
              autoscaler divides usage by. KN-C012 reads CPU utilization only: a memory utilization target whose
              containers declare no memory request, and a custom or external metric, are not read
            rules: [KN-C012]
          - id: controller-computes-the-count
            title: The autoscaler computes a replica count and writes it to the target
            observable: false
            holds: >-
              about every fifteen seconds the HorizontalPodAutoscaler controller compares usage with the target,
              computes how many replicas that calls for, clamps it between minReplicas and maxReplicas and
              writes it through the target's scale subresource. That happens in the controller manager of a
              running cluster, so kube-noob does not check it and does not count it as passed.
          - id: manifest-leaves-the-count-to-the-autoscaler
            title: No workload an autoscaler scales also sets spec.replicas
            # Measured (G435): fires on any spec.replicas beside an autoscaler that names the workload, 0
            # included (high: a target at 0 switches the autoscaler off); silent when the field is absent.
            needs: [HorizontalPodAutoscaler]
            reads: [HorizontalPodAutoscaler, Deployment, StatefulSet, ReplicaSet]
            holds: >-
              no Deployment, StatefulSet or ReplicaSet that an autoscaler here scales sets spec.replicas, so
              applying the manifest again does not reset the count the autoscaler chose
            rules: [KN-C014]
          - id: floor-keeps-more-than-one-replica
            title: No replicated workload here is left at a single replica
            # Measured (G435): fires on a workload declaring fewer than two replicas (an absent spec.replicas
            # is the default of one) unless an autoscaler with minReplicas of two or more names it; a floor of
            # one, or no minReplicas, does not excuse it. It fires on a second workload no autoscaler scales when
            # that one declares a single replica, and is silent on one declaring two: nothing asks for an
            # autoscaler. On a fragment the autoscaler may be in another file, hence `absent` (G408).
            needs: [Deployment, StatefulSet, ReplicaSet]
            holds: >-
              every Deployment, StatefulSet and ReplicaSet here declares two or more replicas, or is scaled by
              an autoscaler whose own floor is two or more, so scaling down never leaves one replica to carry
              everything. KN-C007 reads the declared count and the floor: no rule here asks that a workload have
              an autoscaler at all
            rules: [KN-C007]
            absent: [KN-C007]
          - id: scheduler-places-the-new-replicas
            title: The scheduler finds a node for each new replica
            observable: false
            holds: >-
              a replica the autoscaler adds is a Pod like any other: it needs a node with room for its requests.
              Whether one exists, or a cluster autoscaler adds one, is decided in a running cluster and no
              manifest records it, so kube-noob does not check it and does not count it as passed.
      - id: mech-net-request-to-pod
        title: A request finds your Pod
        layer: network
        docs: [kubernetes]
        examples: [mechanism/complete, mechanism/broken]
        objectives:
          - Follow one request from the edge to a container, hop by hop
          - See which hop your own manifests cannot answer for
        keyPoints:
          - Each hop is a separate question, and a hop nothing read is not a hop that works.
          - The walk stops at the first hop it cannot judge; the hops after it are not reported as fine.
        steps:
          - id: edge-admits
            title: There is an Ingress at the edge with nothing known-dangerous on it
            needs: [Ingress]
            holds: an Ingress is here and the rules that read it found nothing wrong
            rules: [KN-N003, KN-N009, KN-N011, KN-V019]
          - id: edge-names-a-service-here
            title: The Ingress routes to a Service that is here, on a port it serves
            # The link between the edge and the Service, which nothing read (G405): the two hops either side of
            # this one were adjacent, and an Ingress routing to a Service that does not exist walked complete.
            # `needs` is the Ingress alone. A missing Service is not a stop of its own: on a whole namespace
            # KN-V024 fires on it, and on a fragment the rule says it had nothing to judge and the hop stops.
            # `reads` adds Service, so one that is HERE and that nothing could read (a Knative Service) stops it.
            needs: [Ingress]
            reads: [Ingress, Service]
            holds: every Service an Ingress backend names is a Service in this namespace, and the port the
              backend names is one that Service serves
            rules: [KN-V024]
          - id: service-selects-pods
            title: The Service finds pods to send it to
            needs: [Service]
            holds: the Service selects at least one pod in this bundle, and no named targetPort it uses is missing
              from the selected containers
            rules: [KN-V011, KN-V012, KN-N008]
            # "matches no pod template in this input": on a fragment the pod may be in another file (G408).
            absent: [KN-V011]
          - id: workload-selects-its-own-pods
            title: The workload owns the pods it selects
            needs: [Deployment, StatefulSet, DaemonSet, ReplicaSet]
            holds: the workload's selector matches the labels on its own pod template
            rules: [KN-V010]
          - id: policy-admits-the-packet
            title: The namespace has a network policy, and it is neither open nor inert
            # No `needs`: a namespace with NO NetworkPolicy is judged, because KN-N001 is the rule that fires on
            # exactly that absence. `reads` is what stops the walk here -- a policy that IS here and that nothing
            # could read leaves the hop unjudged, which is not the same thing at all.
            needs: []
            reads: [NetworkPolicy]
            holds: the namespace has a NetworkPolicy, and none of them is an allow-all or selects nothing
            rules: [KN-N001, KN-N007, KN-N012]
            # KN-N001 declines on a fragment by itself. KN-N012 ("selects none of the pod templates here") does
            # not, and the pod it would select may be in another file (G408).
            absent: [KN-N012]
          - id: pod-reports-ready
            title: The containers declare a readiness probe
            needs: [Deployment, StatefulSet, DaemonSet, ReplicaSet]
            holds: the containers declare a readiness probe, so the endpoint appears only when they can serve
            rules: [KN-C001]
          - id: packet-reaches-the-container
            title: The packet crosses the node to the container
            observable: false
            holds: >-
              the veth pair, the bridge and the overlay carry it the last hop. Nothing in a manifest records
              this, so kube-noob does not check it and does not count it as passed.
      - id: mech-net-pod-calls-a-service
        title: A Pod calls a Service
        layer: network
        docs: [kubernetes]
        examples: [mechanism/service/complete, mechanism/service/broken]
        objectives:
          - Follow one call from a pod to a Service by name, and on to a pod behind it
          - See where the call needs cluster DNS, and which hops only a running cluster can answer
        keyPoints:
          - A call by name is two questions before it is a connection -- may the pod reach DNS, and does the name
            resolve -- and only the first is in a manifest.
          - The Service hop judges the Service against the pods it selects in this namespace; a Service with no
            pod template here is not judged, rather than called fine.
        steps:
          - id: namespace-has-a-policy
            title: The namespace has a network policy, and it is neither open nor inert
            # Measured (G420): first, because KN-N013 below has nothing to judge when the namespace has no
            # NetworkPolicy at all. KN-N001 fires on exactly that absence, so a namespace with no policy is
            # BROKEN here and the DNS hop then stops; G400 keeps both in the answer.
            needs: []
            reads: [NetworkPolicy]
            holds: the namespace has a NetworkPolicy, and none of them is an allow-all or selects nothing
            rules: [KN-N001, KN-N007, KN-N012]
            absent: [KN-N012]
          - id: egress-keeps-dns
            title: No network policy here stops the calling pods from reaching cluster DNS
            # Measured (G420): a policy restricting only Ingress -- egress unrestricted -- is evaluated and
            # silent; an Egress policy with no rule for port 53 fires; one allowing UDP and TCP 53 is silent; no
            # NetworkPolicy at all is "no networking.k8s.io NetworkPolicy in the input", and the hop stops.
            needs: []
            reads: [NetworkPolicy]
            holds: >-
              no NetworkPolicy here restricts egress without leaving a route to port 53, so the pods it selects
              can still resolve a Service name. KN-N013 reads the policies in this input; one applied by the
              cluster (an AdminNetworkPolicy, a CNI's own) is not read
            rules: [KN-N013]
          - id: name-resolves
            title: Cluster DNS resolves the Service name to its ClusterIP
            observable: false
            holds: >-
              CoreDNS answers my-svc.my-namespace.svc with the Service's ClusterIP. Nothing in a manifest records
              the answer, so kube-noob does not check it and does not count it as passed.
          - id: service-selects-pods
            title: The Service finds pods to send it to, on a port they declare
            needs: [Service]
            holds: >-
              the Service selects at least one pod template in this namespace, no named targetPort is missing
              from the selected containers, and no numeric targetPort is outside the ports they declare
            rules: [KN-V011, KN-V012, KN-V023, KN-N008]
            # Measured (G420): with no pod spec in the input all three abstain ("no pod spec in the input"), from a
            # directory and from a single file alike. Only KN-V011 fires on an ABSENT object ("selects no pod
            # template here"), which on a fragment may be in another file. KN-V023 compares a Service with pods
            # that ARE here, so its finding stands on a fragment too.
            absent: [KN-V011]
          - id: workload-selects-its-own-pods
            title: The workload owns the pods it selects
            needs: [Deployment, StatefulSet, DaemonSet, ReplicaSet]
            holds: the workload's selector matches the labels on its own pod template
            rules: [KN-V010]
          - id: pod-reports-ready
            title: The containers declare a readiness probe
            needs: [Deployment, StatefulSet, DaemonSet, ReplicaSet]
            holds: the containers declare a readiness probe, so the endpoint appears only when they can serve
            rules: [KN-C001]
          - id: clusterip-is-translated
            title: The node sends the ClusterIP to one of the endpoints
            observable: false
            holds: >-
              kube-proxy (iptables, IPVS or nftables) or the CNI's own replacement rewrites the ClusterIP to a
              ready endpoint. Nothing in a manifest records this, so kube-noob does not check it and does not
              count it as passed.
      - id: mech-net-network-policy
        title: A packet meets a NetworkPolicy
        layer: network
        docs: [kubernetes]
        examples: [mechanism/networkpolicy/complete, mechanism/networkpolicy/broken]
        objectives:
          - Follow what decides whether a packet to one of your pods is admitted or dropped
          - See which of those decisions are in your manifests, and which only the node makes
        keyPoints:
          - A namespace with no NetworkPolicy admits everything, and a policy isolates only the pods it selects.
          - The API server stores a policy; the CNI enforces it, per packet, and neither of those is in a manifest.
          - No rule here compares a policy's ports with the ports your containers declare, so the walk does not
            claim it.
        steps:
          - id: namespace-has-a-policy
            title: The namespace has a NetworkPolicy
            # Measured (G421): first, because every rule below reads a NetworkPolicy and abstains without one
            # ("no networking.k8s.io NetworkPolicy in the input"). KN-N001 FIRES on that absence, so a namespace
            # with none is BROKEN here and the next hop then stops; G400 keeps the break as the answer. With no
            # workload, and on a fragment, KN-N001 abstains itself and the walk stops here with nothing judged.
            needs: []
            reads: [NetworkPolicy]
            holds: >-
              the namespace has at least one NetworkPolicy; with none, every pod in it accepts every connection.
              KN-N001 counts networking.k8s.io policies only, so a namespace whose one policy is a
              CiliumNetworkPolicy is reported as having none
            rules: [KN-N001]
          - id: policy-selects-pods-here
            title: Every NetworkPolicy here selects a pod that is here
            # Measured (G421): fires on a podSelector matching no pod template, and on a fragment too -- where
            # the pod may be in the file nobody passed, hence `absent`. Silent on a second workload that no
            # policy selects: that is the other direction, and no rule in this build reads it.
            needs: []
            reads: [NetworkPolicy]
            holds: >-
              every NetworkPolicy here selects at least one pod template in this namespace, so none of them is a
              label typo that protects nothing. KN-N012 does not read the other direction: a workload no policy
              selects stays open to every source, and nothing here reports it
            rules: [KN-N012]
            absent: [KN-N012]
          - id: cni-enforces-the-policy
            title: The cluster's network plugin turns the policy into rules on each node
            observable: false
            holds: >-
              the API server only stores a NetworkPolicy. The CNI's agent on each node turns it into an allow-list
              for each selected pod, and a CNI that does not implement NetworkPolicy leaves it stored and inert.
              Nothing in a manifest records which CNI runs, so kube-noob does not check it and does not count it
              as passed.
          - id: no-rule-admits-every-source
            title: No NetworkPolicy here carries an ingress rule that is open to every source
            # Measured (G421): fires on a rule of {}, on `from: []`, on `namespaceSelector: {}` and on an ipBlock
            # of 0.0.0.0/0. It was silent on a rule that names ports and no `from` (every source, on those
            # ports) until G432, and fires on it now. Still silent on `from: [{podSelector: {}}]` (every pod of
            # this namespace). The sentence says so.
            needs: []
            reads: [NetworkPolicy]
            holds: >-
              no NetworkPolicy here has an ingress rule that is empty, names ports and no `from`, lists no peer,
              selects every namespace or allows 0.0.0.0/0. KN-N007 reads those shapes: a rule whose `from` is
              `podSelector: {}` still admits every pod of this namespace, and is not reported
            rules: [KN-N007]
          - id: packet-is-admitted-or-dropped
            title: The node admits the packet a rule allows and drops the rest
            observable: false
            holds: >-
              a packet from a pod a rule's `from` selects, to a port that rule names, is let through and its
              reply follows it back; anything else sent to a selected pod is discarded on the node, with no
              answer. Which pod is calling, and on which port, is decided per packet, so kube-noob does not check
              it and does not count it as passed; and no rule in this build compares a policy's ports with the
              ports the containers declare.
          - id: egress-keeps-dns
            title: No network policy here stops the pods it selects from reaching cluster DNS
            # Measured (G420, again for G421): silent on an ingress-only policy and on an Egress policy allowing
            # UDP and TCP 53; fires on a default-deny over Egress with no route to 53.
            needs: []
            reads: [NetworkPolicy]
            holds: >-
              no NetworkPolicy here restricts egress without leaving a route to port 53, so a pod it selects can
              still resolve a name before it sends a packet. KN-N013 reads the policies in this input; one
              applied by the cluster (an AdminNetworkPolicy, a CNI's own) is not read
            rules: [KN-N013]
      - id: mech-sec-rbac-and-serviceaccounts
        title: RBAC and ServiceAccounts
        layer: security
        docs: [k8s-rbac]
        examples: [mechanism/rbac/complete, mechanism/rbac/broken]
        objectives:
          - Follow what stands between a pod's identity and the API, from the token it holds to the grants behind it
          - See which of those your own manifests answer for, and which only a running API server decides
        keyPoints:
          - Each rule on this path reads every object of its kind in the input. None of them joins a pod to its
            ServiceAccount, a ServiceAccount to its bindings, or a binding to the role it names.
          - A role that a binding names and that is not in the input -- the built-in edit, admin and view among
            them -- is a role nothing here read, so the walk never says what a ServiceAccount can do.
          - Every rule on the RBAC and Secret hops abstains when its kind is absent, so a bundle with no binding,
            no Role or no Secret stops the walk at that hop instead of passing it.
        steps:
          - id: no-pod-automounts-a-token
            title: A ServiceAccount is here, and no pod spec leaves the automatic token mount on
            # Measured (G401): with no pod spec KN-S014 abstains ("no pod spec in the input"), so the walk
            # stops. With a pod spec and NO ServiceAccount object it FIRES -- from a directory and from a
            # single file alike -- on a ServiceAccount nobody passed, which may be the one that opts out. So
            # the hop needs the ServiceAccount: without one it is not judged, rather than reported BROKEN on
            # evidence that cannot say so (the direction G394 found on the network lesson's policy hop).
            needs: [ServiceAccount]
            reads: [ServiceAccount, Pod, Deployment, StatefulSet, DaemonSet, ReplicaSet, Job, CronJob]
            holds: >-
              every pod spec here sets automountServiceAccountToken false, or leaves it unset while running as a
              ServiceAccount in this input that sets it false. KN-S014 does not read a projected
              serviceAccountToken volume a pod mounts on purpose, and does not check that the ServiceAccount a
              pod names exists
            rules: [KN-S014]
          - id: no-binding-grants-to-everyone
            title: No RoleBinding or ClusterRoleBinding here names everyone as a subject
            needs: [RoleBinding, ClusterRoleBinding]
            holds: >-
              no binding here has system:unauthenticated, system:anonymous, system:authenticated,
              system:serviceaccounts or system:authenticated:oauth among its subjects. A binding whose own name
              starts with system: or that carries the rbac-defaults bootstrapping label is left alone, and
              KN-S028 does not check that a subject exists
            rules: [KN-S028]
          - id: no-binding-names-cluster-admin
            title: No RoleBinding or ClusterRoleBinding here names the cluster-admin role
            needs: [RoleBinding, ClusterRoleBinding]
            holds: >-
              no binding here has roleRef.name cluster-admin. A role of the same reach under another name is not
              what KN-S016 reads
            rules: [KN-S016]
          - id: no-role-uses-a-wildcard
            title: No Role or ClusterRole here uses a wildcard in verbs, resources or apiGroups
            # Measured (G401): a RoleBinding whose Role is not in the input leaves KN-S015 and KN-S017 with "no
            # ClusterRole or Role in the input", and the walk stops here -- the binding hops before it are
            # judged, the grants behind the binding are not.
            needs: [Role, ClusterRole]
            holds: >-
              no rule of any Role or ClusterRole in this input lists '*' in verbs, resources or apiGroups. Every
              role here is read, bound or not; a role a binding names that is not in this input was not read
            rules: [KN-S015]
          - id: no-role-carries-an-escalation-grant
            title: No Role or ClusterRole here carries a grant KN-S017 lists as a privilege-escalation path
            needs: [Role, ClusterRole]
            holds: >-
              no Role or ClusterRole in this input grants escalate, bind or impersonate; reads Secrets other than
              by get on named ones; creates pods/exec or pods/attach; names nodes/proxy; creates or changes
              workloads; patches ephemeral containers; creates PersistentVolumes; or writes ControllerRevisions.
              That list is the whole of what KN-S017 reads, and a role not in this input was not read
            rules: [KN-S017]
          - id: no-long-lived-token-secret
            title: A Secret is here, and none of them is a long-lived ServiceAccount token
            # Last of the observable hops on purpose. Measured (G401): with no Secret in the input KN-S027
            # abstains, from a directory too, so this hop stops the walk -- and a bundle whose Secrets live in
            # an external store has none. Placed second, where the credential belongs in the telling, it would
            # stop most walks before a single RBAC hop was read.
            needs: [Secret]
            holds: >-
              no Secret in this input has type kubernetes.io/service-account-token, the legacy kind that holds
              a token which never expires. KN-S027 reads the Secrets that are here; one that lives only in the
              cluster is not in a manifest
            rules: [KN-S027]
          - id: the-api-server-authorizes-the-request
            title: The API server authorizes the request
            observable: false
            holds: >-
              the authorizer chain decides each request from the bindings and roles in the live cluster --
              built-in and aggregated ClusterRoles, bindings made in other namespaces, webhook and node
              authorizers. That is cluster state and no manifest here records it, so kube-noob does not check it
              and does not count it as passed.
  - id: kubernetes
    title: Kubernetes foundations
    summary: Workloads, services, storage, security context, probes, resources, RBAC, NetworkPolicy, debugging.
    lessons:
      - id: k8s-101-objects
        title: Core objects and how they fit together
        docs: [kubernetes]
        objectives: [Pick the right workload kind, Wire a Service to pods, Know where configuration and storage live]
        keyPoints:
          - Deployments for stateless replicas, StatefulSets for stable identity and per-replica volumes.
          - A Service only routes to Ready pods whose labels match its selector.
        tryIt: ["kube-noob generate --name web --namespace demo --image nginxinc/nginx-unprivileged:1.27 --platform kubernetes"]
        exercises: [k8s-ex-hardened-deployment]
      - id: k8s-102-security
        title: Pod Security Standards and the hardened securityContext
        docs: [k8s-pss, k8s-images]
        objectives: [Apply the restricted profile, Pin images]
        keyPoints:
          - runAsNonRoot, allowPrivilegeEscalation false, drop ALL capabilities, RuntimeDefault seccomp.
          - Pin images by digest; never latest.
        exercises: [k8s-ex-hardened-deployment]
      - id: k8s-103-reliability
        title: Probes, resources, PDBs and spreading
        docs: [k8s-probes, k8s-resources, k8s-pdb, k8s-topology-spread]
        objectives: [Write safe probes, Size requests and limits, Keep upgrades unblocked]
        keyPoints:
          - Liveness checks only the process; readiness may check dependencies.
          - PDB maxUnavailable 1 with at least 2 replicas.
          - With an HPA the manifest leaves spec.replicas out; the HPA's minReplicas sets the floor.
        exercises: [k8s-ex-ha-web]
      - id: k8s-104-storage
        title: Storage access modes
        docs: [storage-access-modes]
        objectives: [Match access modes to provisioners, Avoid Multi-Attach deadlocks]
        keyPoints:
          - EBS (gp3-csi) is ReadWriteOnce only.
          - Replicas that each need their own disk belong in a StatefulSet.
        exercises: [k8s-ex-statefulset-storage]
      - id: k8s-105-network-rbac
        title: NetworkPolicy and RBAC least privilege
        docs: [k8s-networkpolicy, k8s-rbac, k8s-services]
        objectives: [Default-deny and explicit allows, Least-privilege Roles]
        keyPoints:
          - Policies are additive allow-lists once a pod is selected.
          - No wildcards and no cluster-admin bindings for apps.
        exercises: [k8s-ex-least-privilege-rbac]
      - id: k8s-106-debugging
        title: Debugging pods systematically
        docs: [k8s-debug-pods, k8s-deprecations]
        objectives: [Read events and exit codes, Migrate removed APIs]
        keyPoints:
          - "Exit 137 = SIGKILL/OOMKilled; 143 = SIGTERM (often a liveness kill)."
          - "policy/v1beta1 PodDisruptionBudget was removed in 1.25."
        exercises: [k8s-ex-migrate-removed-apis]
    exercises:
      - id: k8s-ex-hardened-deployment
        title: Hardened Deployment + Service
        points: 15
        prompt: >-
          Write a Deployment named 'web' in namespace 'demo' running image 'nginxinc/nginx-unprivileged:1.27.2' on port
          8080 with 2 replicas, plus a ClusterIP Service named 'web' that targets it. It must pass the Pod Security
          'restricted' profile (non-root, no privilege escalation, drop ALL capabilities, RuntimeDefault seccomp),
          set CPU/memory requests and a memory limit, and have readiness and liveness probes.
        hints:
          - Put runAsNonRoot and seccompProfile at pod level; allowPrivilegeEscalation and capabilities per container.
          - The Service selector must match the pod template labels exactly.
        checks:
          platform: kubernetes
          kinds: [Deployment, Service]
          schemaValid: true
          forbidRules: [KN-S002, KN-S003, KN-S006, KN-S008, KN-C001, KN-C004, KN-C005, KN-V011, KN-S012]
          assertions:
            - {kind: Deployment, path: spec.replicas, gte: 2}
            - {kind: Deployment, path: "spec.template.spec.containers[0].image", matches: "nginx-unprivileged"}
        reference:
          name: web
          namespace: demo
          image: nginxinc/nginx-unprivileged:1.27.2
          platform: kubernetes
          replicas: 2
          port: 8080
      - id: k8s-ex-ha-web
        title: Highly available web tier
        points: 20
        prompt: >-
          Produce manifests for 'shop-api' (namespace 'shop', image 'ghcr.io/acme/shop-api:2.3.1', port 8080) on
          vanilla Kubernetes with at least 3 replicas spread across zones, a PodDisruptionBudget that still allows node
          drains, an HPA (min 3, max 10) driven by CPU utilization that owns the replica count, and a default-deny
          NetworkPolicy plus an allow rule for the ingress controller namespace 'ingress-nginx'. Expose it with an
          Ingress on host shop.example.com with TLS.
        hints:
          - PDB maxUnavailable 1, never minAvailable equal to replicas.
          - HPA utilization needs CPU requests on every container.
          - With an HPA, leave spec.replicas out of the Deployment (every apply would reset it); minReplicas is the floor.
        checks:
          platform: kubernetes
          kinds: [Deployment, Service, Ingress, PodDisruptionBudget, HorizontalPodAutoscaler, NetworkPolicy]
          schemaValid: true
          maxSeverity: low
          forbidRules: [KN-C009, KN-C010, KN-C012, KN-C014, KN-N003, KN-N001]
          assertions:
            - {kind: HorizontalPodAutoscaler, path: spec.minReplicas, gte: 3}
            - {kind: Ingress, path: "spec.tls[0].hosts[0]", equals: shop.example.com}
        reference:
          name: shop-api
          namespace: shop
          image: ghcr.io/acme/shop-api:2.3.1
          platform: kubernetes
          replicas: 3
          hpaMaxReplicas: 10
          exposure: {type: ingress, host: shop.example.com, ingressClass: nginx}
      - id: k8s-ex-statefulset-storage
        title: Per-replica storage with a StatefulSet
        points: 20
        prompt: >-
          Run 3 replicas of 'ledger' (namespace 'fin', image 'quay.io/acme/ledger:5.1.0', port 7000) where each replica
          needs its own 20Gi ReadWriteOnce volume mounted at /var/lib/ledger. Use the cluster default StorageClass.
        hints:
          - Three replicas sharing one RWO claim fail with Multi-Attach; use volumeClaimTemplates.
          - A StatefulSet needs a headless Service (clusterIP None).
        checks:
          platform: kubernetes
          kinds: [StatefulSet, Service]
          schemaValid: true
          forbidRules: [KN-ST002, KN-ST001, KN-ST005]
          assertions:
            - {kind: StatefulSet, path: "spec.volumeClaimTemplates[0].spec.resources.requests.storage", equals: 20Gi}
            - {kind: StatefulSet, path: spec.replicas, gte: 3}
        reference:
          name: ledger
          namespace: fin
          image: quay.io/acme/ledger:5.1.0
          platform: kubernetes
          workload: statefulset
          replicas: 3
          port: 7000
          storage: {size: 20Gi, accessMode: ReadWriteOnce, mountPath: /var/lib/ledger}
      - id: k8s-ex-least-privilege-rbac
        title: Least-privilege Role for a config reloader
        points: 10
        prompt: >-
          Create a ServiceAccount 'reloader' in namespace 'apps' and a namespaced Role + RoleBinding that only lets it
          get, list and watch ConfigMaps in that namespace. No wildcards, no Secrets, no cluster-wide permissions.
        hints:
          - "Role rules need apiGroups [\"\"] for core resources."
        checks:
          platform: kubernetes
          kinds: [ServiceAccount, Role, RoleBinding]
          schemaValid: true
          forbidRules: [KN-S015, KN-S016, KN-S017]
          assertions:
            - {kind: Role, path: "rules[0].resources", contains: configmaps}
            - {kind: RoleBinding, path: roleRef.kind, equals: Role}
      - id: k8s-ex-migrate-removed-apis
        title: Migrate removed APIs for Kubernetes 1.35
        points: 15
        prompt: >-
          This bundle worked on Kubernetes 1.20. Rewrite it so it applies on 1.35 without changing behaviour.
        starter: |
          apiVersion: policy/v1beta1
          kind: PodDisruptionBudget
          metadata: {name: api, namespace: apps}
          spec:
            maxUnavailable: 1
            selector: {matchLabels: {app: api}}
          ---
          apiVersion: batch/v1beta1
          kind: CronJob
          metadata: {name: cleanup, namespace: apps}
          spec:
            schedule: "0 3 * * *"
            jobTemplate:
              spec:
                template:
                  spec:
                    restartPolicy: OnFailure
                    containers:
                    - name: cleanup
                      image: registry.example.com/tools/cleanup:1.0.4
                      resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 128Mi}}
        hints:
          - "policy/v1 and batch/v1 are the replacements; schemas are otherwise compatible."
        checks:
          platform: kubernetes
          version: "1.35"
          kinds: [PodDisruptionBudget, CronJob]
          schemaValid: true
          forbidRules: [KN-V005, KN-V006]
          assertions:
            - {kind: CronJob, path: spec.schedule, equals: "0 3 * * *"}
    quiz:
      - id: k8s-q-exit137
        question: A container's lastState shows exit code 137. What is the most likely cause?
        choices: [The command was not found, It was killed with SIGKILL - typically OOMKilled, It segfaulted, It exited cleanly]
        answer: 1
        explanation: 137 = 128 + 9 (SIGKILL). The kernel OOM killer or a forced kill after the grace period sends SIGKILL.
        source: kn:k8s-debug-pods#0
      - id: k8s-q-pdb-removed
        question: In which Kubernetes version was policy/v1beta1 PodDisruptionBudget removed?
        choices: ["1.22", "1.25", "1.29", "1.32"]
        answer: 1
        explanation: The deprecation guide lists policy/v1beta1 PodDisruptionBudget among the 1.25 removals; use policy/v1.
        source: kn:k8s-deprecations#0
      - id: k8s-q-liveness
        question: What should a liveness probe check?
        choices: [The database and downstream APIs, Only whether the process itself is healthy, Nothing - use readiness only, The node's disk space]
        answer: 1
        explanation: Liveness failures restart containers; checking dependencies turns one slow dependency into a restart storm.
        source: kn:k8s-probes#0
      - id: k8s-q-rwx-ebs
        question: A PVC requests ReadWriteMany from StorageClass gp3-csi. What happens?
        choices: [It binds and works on all nodes, It stays Pending because EBS is ReadWriteOnce only, It silently becomes ReadWriteOnce, It binds but is read-only]
        answer: 1
        explanation: gp3-csi uses the AWS EBS CSI driver - block volumes attached to one node in one AZ.
        source: kn:storage-access-modes#0
      - id: k8s-q-hpa-unknown
        question: An HPA shows <unknown>/70% CPU. What is the most common cause?
        choices: [Too many replicas, Target containers have no CPU requests, The HPA uses autoscaling/v2, The Deployment has a PDB]
        answer: 1
        explanation: Utilization is usage divided by request; without CPU requests it cannot be computed.
        source: kn:k8s-resources#0
  - id: openshift
    title: OpenShift
    summary: SCCs and arbitrary UIDs, Routes and TLS, OVN-Kubernetes egress, operators, version map.
    lessons:
      - id: ocp-101-platform
        title: What OpenShift adds to Kubernetes
        docs: [openshift, ocp-operators]
        objectives: [Know the OpenShift-only APIs, Map OCP to Kubernetes versions]
        keyPoints:
          - "Route is route.openshift.io/v1; DeploymentConfig is deprecated since 4.14."
          - "OCP 4.22 runs Kubernetes 1.35."
      - id: ocp-102-scc
        title: SCCs and arbitrary UIDs
        docs: [ocp-scc, ocp-arbitrary-uid]
        objectives: [Pass restricted-v2 without exceptions, Build images for random UIDs]
        keyPoints:
          - Do not hard-code runAsUser on OpenShift.
          - chgrp -R 0 and chmod -R g=u for writable paths.
        exercises: [ocp-ex-restricted-v2]
      - id: ocp-103-routes
        title: Routes, TLS and router NetworkPolicies
        docs: [ocp-routes, k8s-networkpolicy]
        objectives: [Choose edge/reencrypt/passthrough, Allow the router through NetworkPolicy]
        exercises: [ocp-ex-secure-route]
      - id: ocp-104-egress
        title: EgressFirewall
        docs: [ocp-egressfirewall]
        objectives: [Write first-match egress rules correctly]
        exercises: [ocp-ex-egressfirewall]
    exercises:
      - id: ocp-ex-restricted-v2
        title: Make a workload pass restricted-v2
        points: 15
        prompt: >-
          This Deployment is rejected on OpenShift 4.22 with 'unable to validate against any security context
          constraint'. Fix it so it is admitted under restricted-v2 without granting any extra SCC.
        starter: |
          apiVersion: apps/v1
          kind: Deployment
          metadata: {name: api, namespace: team-a}
          spec:
            replicas: 2
            selector: {matchLabels: {app: api}}
            template:
              metadata: {labels: {app: api}}
              spec:
                securityContext: {runAsUser: 1000, fsGroup: 2000}
                containers:
                - name: api
                  image: quay.io/acme/api:3.4.0
                  securityContext: {allowPrivilegeEscalation: true, capabilities: {add: [NET_ADMIN]}}
                  resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {memory: 256Mi}}
        hints:
          - "Remove fixed UIDs/fsGroup, set allowPrivilegeEscalation false and drop ALL capabilities."
        checks:
          platform: openshift
          version: "4.22"
          kinds: [Deployment]
          schemaValid: true
          forbidRules: [KN-S004, KN-S005, KN-S002, KN-S001]
      - id: ocp-ex-secure-route
        title: Secure Route with router-only access
        points: 15
        prompt: >-
          Expose Service 'catalog' (namespace 'store', image 'quay.io/acme/catalog:1.8.0', port 8080) on OpenShift
          with an edge-terminated Route on host catalog.apps.example.com that redirects HTTP to HTTPS, and
          NetworkPolicies that only admit traffic from the router and from pods in the same namespace.
        hints:
          - "The router namespace carries policy-group.network.openshift.io/ingress: \"\""
        checks:
          platform: openshift
          kinds: [Deployment, Service, Route, NetworkPolicy]
          schemaValid: true
          maxSeverity: low
          forbidRules: [KN-N002, KN-N001, KN-V002]
          assertions:
            - {kind: Route, path: spec.tls.termination, in: [edge, reencrypt]}
            - {kind: Route, path: spec.tls.insecureEdgeTerminationPolicy, equals: Redirect}
        reference:
          name: catalog
          namespace: store
          image: quay.io/acme/catalog:1.8.0
          platform: openshift
          replicas: 2
          exposure: {type: route, host: catalog.apps.example.com, tls: edge}
      - id: ocp-ex-egressfirewall
        title: Egress allow-list for a payments project
        points: 10
        prompt: >-
          Write the EgressFirewall for project 'payments' allowing only api.stripe.com and the internal range
          10.0.0.0/16, denying everything else.
        hints:
          - "The object must be named default; the catch-all Deny goes last."
        checks:
          platform: openshift
          kinds: [EgressFirewall]
          schemaValid: true
          forbidRules: [KN-V015, KN-N006]
          assertions:
            - {kind: EgressFirewall, path: "spec.egress[0].type", equals: Allow}
    quiz:
      - id: ocp-q-route-group
        question: Which apiVersion serves the Route kind?
        choices: [apps.openshift.io/v1, route.openshift.io/v1, networking.k8s.io/v1, gateway.networking.k8s.io/v1]
        answer: 1
        explanation: apps.openshift.io/v1 serves DeploymentConfig; Route is route.openshift.io/v1.
        source: kn:ocp-routes#0
      - id: ocp-q-runasuser
        question: A pod on OpenShift sets runAsUser 1000 and is rejected. Best fix?
        choices: [Grant the privileged SCC, Remove runAsUser and keep runAsNonRoot true, Set runAsUser 0, Disable SCCs]
        answer: 1
        explanation: restricted-v2 uses MustRunAsRange and assigns a UID from the namespace range.
        source: kn:ocp-scc#0
      - id: ocp-q-egress-order
        question: An EgressFirewall lists Deny 0.0.0.0/0 first, then Allow api.stripe.com. Result?
        choices: [Stripe is allowed, Everything external is denied because the first match wins, Rules are merged, The object is rejected]
        answer: 1
        explanation: EgressFirewall rules are evaluated in order and the first match wins.
        source: kn:ocp-egressfirewall#0
      - id: ocp-q-version
        question: Which Kubernetes version does OpenShift 4.22 use?
        choices: ["1.33", "1.34", "1.35", "1.37"]
        answer: 2
        explanation: Each OCP 4.x minor tracks one Kubernetes minor; 4.22 = 1.35.
        source: kn:version-history#0
  - id: rosa-hcp
    title: ROSA with Hosted Control Planes
    summary: HCP architecture, networking, machine pools, upgrades, RWX storage with EFS.
    lessons:
      - id: rosa-101-architecture
        title: Classic vs HCP
        docs: [rosa-hcp]
        objectives: [Explain where the control plane runs, Plan machine pools per AZ]
        keyPoints:
          - Control plane in a Red Hat-owned account; workers reach it over PrivateLink.
          - Control plane upgrades first; machine pools within two minors.
      - id: rosa-102-storage
        title: Shared storage with EFS
        docs: [rosa-efs, storage-access-modes]
        objectives: [Provision RWX on ROSA]
        exercises: [rosa-ex-rwx]
    exercises:
      - id: rosa-ex-rwx
        title: Shared uploads volume on ROSA HCP
        points: 20
        prompt: >-
          On ROSA HCP, run 'uploads' (namespace 'media', image 'quay.io/acme/uploads:4.0.2', port 8080, 2 replicas)
          where both replicas read and write the same 50Gi volume at /data, exposed through an edge Route.
        hints:
          - "gp3-csi cannot do RWX; use an EFS StorageClass such as efs-sc."
        checks:
          platform: rosa-hcp
          kinds: [Deployment, PersistentVolumeClaim, Route]
          schemaValid: true
          forbidRules: [KN-ST001, KN-ST002, KN-N002]
          assertions:
            - {kind: PersistentVolumeClaim, path: "spec.accessModes[0]", equals: ReadWriteMany}
        reference:
          name: uploads
          namespace: media
          image: quay.io/acme/uploads:4.0.2
          platform: rosa-hcp
          replicas: 2
          storage: {size: 50Gi, accessMode: ReadWriteMany, mountPath: /data}
          exposure: {type: route, tls: edge}
    quiz:
      - id: rosa-q-cp
        question: Where does the ROSA HCP control plane run?
        choices: [On dedicated nodes in the customer VPC, As pods in a Red Hat-owned AWS account, On the worker nodes, In AWS Lambda]
        answer: 1
        explanation: HyperShift runs the control plane as pods in a Red Hat-owned account; workers connect over PrivateLink.
        source: kn:rosa-hcp#0
      - id: rosa-q-upgrade
        question: How are ROSA HCP upgrades sequenced?
        choices: ["Workers first", "Control plane first, then machine pools separately", "Everything at once", "Only by Red Hat"]
        answer: 1
        explanation: The hosted control plane is upgraded first; machine pools follow and must stay within two minors.
        source: kn:rosa-hcp#0
  - id: helm
    title: Helm
    summary: Chart structure, values schema, releases, troubleshooting (Helm 3 and 4).
    lessons:
      - id: helm-101-charts
        title: Charts and releases
        docs: [helm]
      - id: helm-102-troubleshooting
        title: Helm troubleshooting
        docs: [helm-troubleshooting]
    exercises: []
    quiz:
      - id: helm-q-pending
        question: helm upgrade fails with "another operation (install/upgrade/rollback) is in progress". First step?
        choices: [Delete the namespace, Check helm history and roll back to the last good revision, Reinstall Helm, Wait one hour]
        answer: 1
        explanation: The release is stuck in a pending-* state; rollback (or uninstall if the first install failed).
        source: kn:helm-troubleshooting#0
      - id: helm-q-v4
        question: When was Helm 4.0.0 released?
        choices: ["2024-05-15", "2025-11-12", "2026-09-09", "It has not been released"]
        answer: 1
        explanation: helm/helm tag v4.0.0 is dated 2025-11-12.
        source: kn:version-history#0
  - id: stackrox
    title: RHACS / StackRox
